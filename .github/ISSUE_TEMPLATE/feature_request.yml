name: Feature request
description: Suggest an idea for Alison
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the real situation first; the solution comes second.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: safety
    attributes:
      label: Safety
      description: Would it need new rights, a new connection or a new kind of card?
