<script>
'use strict';
/* GET /api/cams (groupes à trier, tris récents, ce qui est appris, étiquettes) ; GET /api/cams/vue?p=&f=&jeton= (une vue) ;
   POST /api/cams/trier {passage, groupe, nom, ecartees[], accord?, par?, affiche?, cacher?}, /api/cams/ignorer {passage, groupe},
   /api/cams/etiquette {genre, nom, cacher? | oublier | retirer_plaque}. Onglets : visages (personnes), animaux et véhicules
   (étiquettes ; 12/10 : la plaque lue par le robot, sûre après 3 images d'accord, rattachée à l'étiquette au tri). */
let C = null, camsOut = {}, camsAccord = {}, camsOnglet = 'visage', camsConfirme = null;
const CAMS_GENRES = [['visage', 'Visages'], ['animal', 'Animaux'], ['vehicule', 'Véhicules']];
const camsAff = n => n ? n.charAt(0).toUpperCase() + n.slice(1) : '';
const camsQuand = s => { try { return new Date(s * 1000).toLocaleString('fr-FR', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}); } catch (_) { return ''; } };
const camsNb = v => String(v).replace('.', ',');
const camsPlaque = p => /^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(p || '') ? p.slice(0, 2) + '-' + p.slice(2, 5) + '-' + p.slice(5) : (p || '');
const camsSlug = t => (t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
const camsEtiq = (genre, nom) => ((C.etiquettes || {})[genre] || []).find(e => e.nom === nom);
const camsNom = (genre, nom) => genre === 'visage' ? camsAff(nom) : ((camsEtiq(genre, nom) || {}).affiche || camsAff(nom));
async function camsPost(chemin, corps){
  const r = await fetch('/api/cams/' + chemin, {method:'POST', cache:'no-store',
    headers:{'Content-Type':'application/json', 'X-Reachy-Jeton': JETON}, body: JSON.stringify(corps || {})});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(perimee(r, data) || data.erreur || ('erreur ' + r.status));
  return data;
}
async function camsCharger(){
  const racine = document.getElementById('cams-root');
  if (!racine) return;
  try { const r = await fetch('/api/cams', {cache:'no-store'}); if (!r.ok) throw new Error(); C = await r.json(); }
  catch (_) { racine.innerHTML = '<p class="empty">Le robot ne répond pas. Réessayer dans un instant.</p>'; return; }
  camsDessiner();
}
function camsCle(g){ return g.passage + ':' + g.groupe; }
function camsGroupe(g){
  const cle = camsCle(g), p = g.proposition || {}, out = camsOut[cle] || {}, visage = g.genre === 'visage';
  const quoi = visage ? '' : ' · ' + esc(g.classe || (g.genre === 'animal' ? 'animal' : 'véhicule'));
  const guess = p.nom && p.par === 'plaque' ? `<span class="cams-guess">Le robot reconnaît la plaque : ${esc(camsNom(g.genre, p.nom))}</span>`
    : p.nom ? `<span class="cams-guess">Le robot pense : ${esc(camsNom(g.genre, p.nom))} (${camsNb(p.score)}, ${p.voix} vues sur ${p.sur})</span>`
    : p.desaccord ? `<span class="cams-guess warn">Le robot hésite</span>`
    : p.pres ? `<span class="cams-guess warn">Ressemble un peu à ${esc(camsNom(g.genre, p.pres))} (${camsNb(p.score)})</span>`
    : `<span class="cams-guess warn">${visage ? 'Personne de connu' : 'Rien de connu'}</span>`;
  const options = visage ? (C.appris || []).map(a => [a.nom, camsAff(a.nom)]) : ((C.etiquettes || {})[g.genre] || []).map(e => [e.nom, e.affiche]);
  const acc = camsAccord[cle];
  const accord = acc ? `<div class="appr-accord"><label><input type="checkbox" data-cams-ok="${esc(cle)}"><span>${esc(camsAff(acc))} est d'accord pour que le robot garde une empreinte de son visage vue par les caméras (des nombres ; les images sont effacées après le tri).</span></label>
      <label>Accord donné par <input type="text" data-cams-par="${esc(cle)}" placeholder="${esc(camsAff(acc))}"></label>
      <div class="cams-acts"><button class="pers-btn primary" data-cams-confirmer="${esc(cle)}">Apprendre pour ${esc(camsAff(acc))}</button><button class="pers-btn cams-ghost" data-cams-retour="${esc(cle)}">Annuler</button></div></div>` : '';
  return `<div class="cams-grp">
    <div class="cams-head"><b>${esc(g.camera_nom)}</b><span>${esc(camsQuand(g.debut))} · ${g.vues.length} vue${g.vues.length > 1 ? 's' : ''}${quoi}</span>${g.plaque ? `<span class="cams-plaque" title="Lue sur au moins 3 images">${esc(camsPlaque(g.plaque))}</span>` : ''}${guess}</div>
    <div class="cams-thumbs">${g.vues.map(f => `<button class="cams-th ${out[f] ? 'out' : ''}" data-cams-vue="${esc(cle)}|${esc(f)}" title="Toucher pour écarter cette vue"><img loading="lazy" alt="Vu par la caméra" src="/api/cams/vue?p=${encodeURIComponent(g.passage)}&f=${encodeURIComponent(f)}&jeton=${encodeURIComponent(JETON)}${appQ()}"></button>`).join('')}</div>
    <p class="note" style="margin-top:6px">Touche une vue pour l'écarter si ${visage ? 'ce n\'est pas la même personne' : 'ce n\'est pas le même'}.</p>
    ${accord || `<div class="cams-acts">
      ${p.nom ? `<button class="pers-btn primary" data-cams-nom="${esc(cle)}|${esc(g.genre)}|${esc(p.nom)}">C'est ${esc(camsNom(g.genre, p.nom))}</button>` : ''}
      <select data-cams-choix="${esc(cle)}|${esc(g.genre)}" aria-label="Qui est-ce ?"><option value="">${p.nom ? (visage ? 'Quelqu\'un d\'autre…' : 'Autre chose…') : 'C\'est…'}</option>${options.filter(o => o[0] !== p.nom).map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}<option value="+">${visage ? '+ Nouvelle personne' : '+ Nouvelle étiquette'}</option></select>
      ${visage ? '' : `<button class="pers-btn" data-cams-cacher="${esc(cle)}" title="Par exemple une voiture garée : le robot ne la gardera plus">Toujours ignorer</button>`}
      <button class="pers-btn cams-ghost" data-cams-ignorer="${esc(cle)}">${visage ? 'Inconnu · ne pas apprendre' : 'Ignorer cette fois'}</button></div>`}
  </div>`;
}
function camsAppris(){
  if (camsOnglet === 'visage') return `<div class="cams-people">${(C.appris || []).map(a => `<div class="cams-person"><b>${esc(camsAff(a.nom))}</b><div>Séances avec le robot<em>${a.robot}</em></div><div>Vues des caméras apprises<em>${a.cameras}</em></div></div>`).join('')}</div>
    <p class="note">Chaque tri devient une séance « caméra » de la personne, visible et oubliable dans Apprentissage.</p>`;
  const liste = (C.etiquettes || {})[camsOnglet] || [];
  if (!liste.length) return `<p class="empty" style="margin:0">Aucune étiquette pour l'instant : trie un premier passage.</p>`;
  return `<ul class="cams-list">${liste.map(e => { const cle = camsOnglet + ':' + e.nom, conf = camsConfirme === cle;
    const plaques = (e.plaques || []).map(pl => `<span class="cams-plaque">${esc(camsPlaque(pl))}<button class="cams-plaque-x" data-cams-plaque="${esc(cle)}|${esc(pl)}" aria-label="Retirer la plaque ${esc(camsPlaque(pl))}" title="Retirer cette plaque">×</button></span>`).join('');
    return `<li><b>${esc(e.affiche)}</b><span>${e.exemples} exemple${e.exemples > 1 ? 's' : ''}${e.cacher ? ' · toujours ignoré' : ''}</span>${plaques}
      <span style="margin-left:auto;display:flex;gap:6px"><button class="pers-btn" data-cams-bascule="${esc(cle)}">${e.cacher ? 'Ne plus ignorer' : 'Toujours ignorer'}</button>
      <button class="pers-btn ${conf ? 'danger' : ''}" data-cams-oublier="${esc(cle)}">${conf ? 'Confirmer l\'oubli' : 'Oublier'}</button></span></li>`; }).join('')}</ul>`;
}
function camsDessiner(){
  const racine = document.getElementById('cams-root');
  if (!racine || !C) return;
  if (!C.actif){ racine.innerHTML = `<p class="empty">${esc(C.manque || 'Rubrique inactive sur cette machine.')}</p>`; return; }
  const tous = C.a_trier.filter(g => (g.genre || 'visage') === camsOnglet), groupes = tous.slice(0, 30);
  const compte = genre => C.a_trier.filter(g => (g.genre || 'visage') === genre).length;
  const recents = C.recents.length ? `<ul class="cams-list">${C.recents.map(r => `<li><b>${r.ignore ? 'Ignoré' : esc(r.affiche || camsAff(r.nom))}</b><span>${esc(r.camera_nom)} · ${esc(camsQuand(r.debut))}${r.vues ? ' · ' + r.vues + ' vues' : ''}</span></li>`).join('')}</ul>` : '<p class="empty" style="margin:0">Rien de trié pour l\'instant.</p>';
  const vide = {visage: 'Rien à trier : les prochains passages devant la sonnette, la terrasse ou le robot arriveront ici.',
                animal: 'Aucun animal à trier : les prochains passages d\'un animal arriveront ici.',
                vehicule: 'Aucun véhicule à trier : les prochaines voitures vues par la sonnette arriveront ici.'}[camsOnglet];
  racine.innerHTML = `<div class="cams-local"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><div><b>100 % local.</b> Les images restent sur la machine. Un passage non trié est effacé après ${C.jours} jour${C.jours > 1 ? 's' : ''} ; un groupe trié est effacé tout de suite, seule l'empreinte reste.</div></div>
    <div class="cams-tabs">${CAMS_GENRES.map(([g, t]) => `<button class="cams-tab ${g === camsOnglet ? 'on' : ''}" aria-pressed="${g === camsOnglet}" data-cams-onglet="${g}">${t} · ${compte(g)}</button>`).join('')}</div>
    ${card('À trier', groupes.length ? groupes.map(camsGroupe).join('') + (tous.length > 30 ? `<p class="note">${tous.length - 30} autre(s) groupe(s) après ceux-ci.</p>` : '') : `<p class="empty" style="margin:0">${vide}</p>`, `<span class="badge">${tous.length}</span>`)}
    ${card(camsOnglet === 'visage' ? 'Ce que le robot a appris' : 'Étiquettes', camsAppris())}
    ${card('Triés récemment', recents)}`;
}
async function camsTrier(cle, genre, nom, extra){
  const [passage, groupe] = cle.split(':');
  try {
    C = await camsPost('trier', Object.assign({passage, groupe: +groupe, nom, ecartees: Object.keys(camsOut[cle] || {}).filter(f => camsOut[cle][f])}, extra || {}));
    delete camsOut[cle]; delete camsAccord[cle];
    toast((extra && extra.affiche) || camsNom(genre, nom) + (genre === 'visage' ? ' : vues apprises, images effacées' : ' : un exemple de plus'));
  } catch (err){ toast(err.message); }
  camsDessiner();
}
function camsNouveau(genre){
  const texte = (prompt(genre === 'visage' ? 'Son prénom ?' : (genre === 'animal' ? 'Son nom ? (ex. Rex, chat du voisin)' : 'Quel véhicule ? (ex. Ma voiture, Facteur)')) || '').trim();
  if (!texte) return null;
  const slug = camsSlug(texte);
  if (!/^[a-z][a-z0-9-]{0,29}$/.test(slug) || slug === 'inconnu'){ toast('Un nom en lettres (30 au plus)'); return null; }
  return {slug, affiche: texte.slice(0, 40)};
}
function camsChoisir(cle, genre, nom){
  let extra = {};
  if (nom === '+'){ const n = camsNouveau(genre); if (!n) return camsDessiner(); nom = n.slug; if (genre !== 'visage') extra.affiche = n.affiche; }
  if (genre === 'visage' && C.accord_requis !== false && !(C.accords || []).includes(nom)){ camsAccord[cle] = nom; return camsDessiner(); }
  return camsTrier(cle, genre, nom, extra);
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button,a'); if (!b) return;
  if (b.dataset.nav === 'cameras') return camsCharger();
  if (b.dataset.camsOnglet){ camsOnglet = b.dataset.camsOnglet; camsConfirme = null; return camsDessiner(); }
  if (b.dataset.camsVue){ const [cle, f] = b.dataset.camsVue.split('|'); camsOut[cle] = camsOut[cle] || {}; camsOut[cle][f] = !camsOut[cle][f]; b.classList.toggle('out', camsOut[cle][f]); return; }
  if (b.dataset.camsNom){ const [cle, genre, nom] = b.dataset.camsNom.split('|'); return camsChoisir(cle, genre, nom); }
  if (b.dataset.camsCacher){
    const genre = camsOnglet, n = camsNouveau(genre); if (!n) return;
    return camsTrier(b.dataset.camsCacher, genre, n.slug, {affiche: n.affiche, cacher: true});
  }
  if (b.dataset.camsIgnorer){
    const [passage, groupe] = b.dataset.camsIgnorer.split(':');
    try { C = await camsPost('ignorer', {passage, groupe: +groupe}); toast('Rien appris, images effacées'); } catch (err){ toast(err.message); }
    return camsDessiner();
  }
  if (b.dataset.camsBascule){
    const [genre, nom] = b.dataset.camsBascule.split(':'), e2 = camsEtiq(genre, nom);
    try { C = await camsPost('etiquette', {genre, nom, cacher: !(e2 && e2.cacher)}); } catch (err){ toast(err.message); }
    return camsDessiner();
  }
  if (b.dataset.camsOublier){
    if (camsConfirme !== b.dataset.camsOublier){ camsConfirme = b.dataset.camsOublier; return camsDessiner(); }
    const [genre, nom] = b.dataset.camsOublier.split(':'); camsConfirme = null;
    try { C = await camsPost('etiquette', {genre, nom, oublier: true}); toast('Étiquette oubliée'); } catch (err){ toast(err.message); }
    return camsDessiner();
  }
  if (b.dataset.camsPlaque){
    const [cle, plaque] = b.dataset.camsPlaque.split('|'), [genre, nom] = cle.split(':');
    try { C = await camsPost('etiquette', {genre, nom, retirer_plaque: plaque}); toast('Plaque retirée'); } catch (err){ toast(err.message); }
    return camsDessiner();
  }
  if (b.dataset.camsRetour){ delete camsAccord[b.dataset.camsRetour]; return camsDessiner(); }
  if (b.dataset.camsConfirmer){
    const cle = b.dataset.camsConfirmer, ok = document.querySelector(`[data-cams-ok="${CSS.escape(cle)}"]`), par = document.querySelector(`[data-cams-par="${CSS.escape(cle)}"]`);
    if (!ok || !ok.checked) return toast('Coche l\'accord de la personne d\'abord');
    if (!par || !par.value.trim()) return toast('Qui donne l\'accord ?');
    return camsTrier(cle, 'visage', camsAccord[cle], {accord: true, par: par.value.trim()});
  }
});

<script>

/* Rubrique Badges : la liste vit dans Home Assistant (liste Local To-do déclarée dans le corps) ; c'est HA qui ouvre la porte.

async function badgPost(chemin, corps){
  const r = await fetch('/api/badges/' + chemin, {method:'POST', cache:'no-store',
    headers:{'Content-Type':'application/json', 'X-Reachy-Jeton': JETON}, body: JSON.stringify(corps || {})});

  return data;
}
function badgCorps(){
  if (!BADG) return '<p class="empty" style="margin:0">Lecture de Home Assistant…</p>';

    : '<div class="row"><div><div class="row-label">Aucun badge</div><div class="row-help">Aucun badge n\'ouvre l\'entrée pour l\'instant.</div></div><div class="row-ctl"><span class="badge">vide</span></div></div>';

  const ajout = R.ecriture && !(a && a.statut === 'attente') ? `<div class="badg-new"><input type="text" id="badg-nom" maxlength="30" placeholder="Prénom" autocomplete="off" aria-label="Prénom du porteur du badge"><button class="pers-btn primary" data-badg-apprendre>Apprendre un badge</button></div>` : '';

async function appLit(){

}
function appareilsVue(){

function badgDessiner(){ const el = document.getElementById('badg-root'); if (el) el.innerHTML = badgCorps(); }
async function badgLit(){
  if (badgBusy || document.hidden || typeof R === 'undefined' || !R) return;
  badgBusy = true;
  try { const r = await fetch('/api/badges', {cache:'no-store'}); if (r.ok) BADG = await r.json(); } catch (_) {}
  badgBusy = false;
  // pendant la saisie d'un prénom, ne pas effacer le champ
  const champ = document.getElementById('badg-nom');

setInterval(() => {
  if (typeof current === 'undefined' || current !== 'badges') return;

setInterval(() => { if (typeof current !== 'undefined' && current === 'badges') badgLit(); }, 15000);
document.addEventListener('click', async e => {

  const b = e.target.closest('[data-badg-apprendre],[data-badg-annuler],[data-badg-retirer],[data-badg-garder]');
  if (!b) return;
  badgErreur = '';
  if (b.hasAttribute('data-badg-garder')) { badgConfirme = ''; return badgDessiner(); }

  if (b.hasAttribute('data-badg-retirer') && !b.hasAttribute('data-badg-sur')) { badgConfirme = b.dataset.badgRetirer; return badgDessiner(); }

    if (b.hasAttribute('data-badg-apprendre')){

      BADG = await badgPost('annuler', {});
    } else {
      BADG = await badgPost('retirer', {uid: b.dataset.badgRetirer});
      badgConfirme = '';
    }
  } catch (err) { badgErreur = err.message; badgConfirme = ''; }
  badgDessiner();
});

const deg = d => (d < 0 ? '−' : d > 0 ? '+' : '') + Math.abs(Math.round(d)) + '°';
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

/* ---------- une ligne de réglage (une seule forme) ---------- */
function disabledFor(r){
  if (!R.ecriture) return true;
  if (R.manque[r.cle]) return true;
  if (r.depend && !R.valeurs[r.depend]) return true;
  return false;
}
function control(r){
  const v = R.valeurs[r.cle], dis = disabledFor(r) ? 'disabled' : '', label = esc(r.intitule);
  switch (r.type){
    case 'interrupteur': return `<div class="line"><span class="sw-state">${v?'Actif':'Coupé'}</span><label class="sw"><input type="checkbox" data-id="${r.cle}" ${v?'checked':''} ${dis} aria-label="${label}"><span></span></label></div>`;
    case 'nombre': return `<div class="line"><input type="range" data-id="${r.cle}" min="${r.min}" max="${r.max}" step="${r.pas}" value="${v}" style="--p:${pct(v,r)}" ${dis} aria-label="${label}"><span class="val" data-val="${r.cle}">${fmt(v,r)}</span></div>`;
    case 'plage': return `<div class="line"><div class="pair"><span>de</span><input type="range" data-id="${r.cle}" data-i="0" min="${r.min}" max="${r.max}" step="${r.pas}" value="${v[0]}" style="--p:${pct(v[0],r)}" ${dis} aria-label="${label} : minimum"><span>à</span><input type="range" data-id="${r.cle}" data-i="1" min="${r.min}" max="${r.max}" step="${r.pas}" value="${v[1]}" style="--p:${pct(v[1],r)}" ${dis} aria-label="${label} : maximum"></div><span class="val" data-val="${r.cle}">${fmt(v,r)}</span></div>`;
    case 'heure': return `<div class="line"><input type="time" data-id="${r.cle}" value="${esc(v)}" ${dis} aria-label="${label}"></div>`;
    case 'choix': return `<div class="line"><select class="choix" data-id="${r.cle}" ${dis} aria-label="${label}">${r.options.map(([k, t]) => `<option value="${esc(k)}" ${k === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>${r.ecouter ? `<button class="reset" type="button" data-parl-ecouter="${esc(r.ecouter)}" ${dis}>Écouter</button>` : ''}${r.voir ? `<button class="reset" type="button" data-parl-voir="${esc(r.cle)}" ${dis}>Voir</button>` : ''}</div>`;
  }
  return '';
}
function row(r){
  const changed = R.ecriture && r.origine !== null && r.origine !== undefined && !same(R.valeurs[r.cle], r.origine);
  const reset = changed && !disabledFor(r) ? `<button class="reset" data-reset="${r.cle}">Valeur d'origine</button>` : '';
  const why = R.manque[r.cle] ? `<div class="row-help">Indisponible : ${({regard:'aucune caméra configurée', visages:'aucun dossier de visages configuré', sons:'aucun assistant vocal configuré'})[R.manque[r.cle]] || 'non configuré'}.</div>` : '';
  return `<div class="row${r.type==='interrupteur'?' row-switch':''}${R.manque[r.cle] || (r.depend && !R.valeurs[r.depend]) ? ' off' : ''}" data-row="${r.cle}"><div><div class="row-label">${esc(r.intitule)}${src()}</div><div class="row-help">${esc(r.aide)}</div>${why}</div><div class="row-ctl">${control(r)}${reset}</div></div>`;
}
const card = (title, body, extra='', from='robot') => `<div class="card"><div class="card-title"><span>${title}${from?src(from):''}</span>${extra}</div><div class="card-body">${body}</div></div>`;
function haCard(lines, path){
  const link = R.ha ? `<a class="ha-link" href="${esc(R.ha + path)}" target="_blank" rel="noopener">Ouvrir dans Home Assistant ↗</a>` : '';
  return `<div class="card"><div class="card-title"><span>Dans Home Assistant${src('ha')}</span>${link}</div><div class="rows">${lines.map(([t, h]) => `<div class="row"><div><div class="row-label">${t}${src('ha')}</div><div class="row-help">${h}</div></div><div class="row-ctl"><span class="ro"><small>se règle dans Home Assistant</small></span></div></div>`).join('')}</div></div>`;
}
function settings(id, opts={}){
  const list = R.schema.filter(r => r.rubrique === id && r.type !== 'secteurs');
  const essentials = list.filter(r => r.niveau === 'essentiel'), expert = list.filter(r => r.niveau === 'expert');
  // Une carte par groupe de réglages essentiels (titre = le groupe ; sans groupe : une carte sans titre, comme avant).
  const cartes = [];
  for (const r of essentials){ const g = r.groupe || ''; let c = cartes.find(x => x.g === g); if (!c) cartes.push(c = {g, l: []}); c.l.push(r); }
  let html = cartes.map(c => `<div class="card">${c.g ? `<div class="card-title"><span>${esc(c.g)}${src()}</span></div>` : ''}<div class="rows">${c.l.map(row).join('')}</div></div>`).join('');
  if (opts.after) html += opts.after;
  if (opts.ha) html += haCard(opts.ha, opts.haPath || '/config/entities');
  if (expert.length){
    let body = '', group = null, buf = [];
    const flush = () => { if (buf.length) body += `${group?`<div class="group">${esc(group)}</div>`:''}<div class="rows">${buf.map(row).join('')}</div>`; buf = []; };
    for (const r of expert){ if (r.groupe !== group){ flush(); group = r.groupe; } buf.push(r); }
    flush();
    html += `<details class="expert" data-expert="${id}"><summary>${ico('chevron',16)}Réglages d'expert <span class="badge">${expert.length}</span></summary>${body}</details>`;
  }
  return html;
}

/* ---------- en direct ---------- */
function live(){
  return `<div class="live">
    <div>${card('Caméra', `<div class="cam" id="cam"><img id="cam-img" alt="Dernière image de la caméra du robot" hidden><svg class="over" id="cam-over" viewBox="-1 -1 2 2" preserveAspectRatio="none" aria-hidden="true"></svg><div class="cam-empty" id="cam-empty">Pas d'image pour l'instant</div><div class="cam-tag"><span class="badge" id="cam-tag">Caméra</span></div></div>`)}
      ${card('Ce qu\'il pense', `<p class="aware" id="aware">…</p><div class="aware-meta">Mise à jour en direct · publiée aussi dans Home Assistant</div>`)}
      ${card('Journal', `<ul class="log" id="log"><li class="empty">Rien pour l'instant</li></ul>`)}
    </div>
    <div>
      ${card('État', `<div class="status-list">
        <div class="status-item"><b>Éveil${src()}</b><span id="st-eveil">…</span></div>
        <div class="status-item"><b>Micro${src()}</b><span id="st-micro">…</span></div>
        <div class="status-item"><b>Mode éco${src('ha')}</b><span id="st-eco">…</span></div>
        <div class="status-item"><b>Activité${src()}</b><span id="st-etat">…</span></div>
      </div>`, '', null)}
      ${card('Son et regard', `<div class="compass" id="compass"></div><div class="legend" id="compass-legend"></div>`)}
      ${card('Humeur', `<div class="mood-label" id="mood-word">…</div><div class="gauges">${[['plaisir','Plaisir'],['eveil','Éveil'],['lien','Lien']].map(([k,t])=>`<div class="gauge"><span>${t}</span><div class="gauge-bar"><div class="gauge-fill" data-g="${k}"></div></div><span class="gauge-num" data-gn="${k}"></span></div>`).join('')}</div><div class="note">Trois jauges de −1 à +1, toujours ramenées au calme avec le temps.</div>`)}
    </div>
  </div>`;
}
function compassSvg(e){
  const cx=200, cy=190, Rr=160, lim = e ? e.limite : 50;
  const pt = (d, r=Rr) => [cx - r*Math.sin(d*Math.PI/180), cy - r*Math.cos(d*Math.PI/180)];
  const arc = (a, b, r=Rr) => { const [x1,y1]=pt(a,r),[x2,y2]=pt(b,r); return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0 ${a>b?1:0} ${x2.toFixed(1)},${y2.toFixed(1)} Z`; };
  const ticks = [-90,-45,0,45,90].map(d=>{const [x1,y1]=pt(d,Rr),[x2,y2]=pt(d,Rr-8),[tx,ty]=pt(d,Rr+14);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--faint)"/><text x="${tx}" y="${ty+4}" text-anchor="middle" font-size="11" fill="var(--faint)">${d>0?'+':''}${d}°</text>`}).join('');
  const ignored = (e ? e.ignorer : []).map(([a,b]) => `<path d="${arc(Math.min(90,Math.max(a,b)),Math.max(-90,Math.min(a,b)),Rr-18)}" fill="var(--bad)" opacity=".18"/>`).join('');
  let rays = '';
  if (e && e.voix && e.voix.age < 120){ const [x,y]=pt(e.voix.angle); rays += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--warn)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/><circle cx="${x}" cy="${y}" r="6" fill="var(--warn)"/>`; }
  if (e){ const [x,y]=pt(e.regard.lacet, Rr-30); rays += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>`; }
  return `<svg viewBox="0 0 400 214" role="img" aria-label="Direction du son et du regard, vue de dessus">
    <path d="${arc(90,-90)}" fill="var(--surface-2)"/><path d="${arc(lim,-lim)}" fill="var(--accent-soft)" opacity=".7"/>${ignored}${ticks}${rays}
    <circle cx="${cx}" cy="${cy}" r="16" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/></svg>`;
}

/* ---------- toucher, bouger, pièce, personnes, maison ---------- */
const touches = () => card('Derniers touchers', `<ul class="log" id="touches"><li class="empty">Aucun depuis le démarrage</li></ul>`);
const motors = () => card('Moteurs', `<div class="motors" id="motors"></div><div class="note" id="motors-note">Position réelle, relevée par le corps quand il guette un toucher.</div>`, '<span class="badge" id="motors-badge">…</span>');
function piece(){
  const list = R.valeurs.ignorer || [];
  const rows = list.length ? list.map(([a,b]) => `<div class="row"><div><div class="row-label">De ${deg(a)} à ${deg(b)}</div><div class="row-help">Ni les voix ni les visages de cette direction ne comptent.</div></div><div class="row-ctl"><span class="badge">ignorée</span></div></div>`).join('')
    : `<div class="row"><div><div class="row-label">Aucune direction ignorée</div><div class="row-help">Toutes les voix et tous les visages comptent.</div></div><div class="row-ctl"><span class="badge">vide</span></div></div>`;
  return card('Vu de dessus', `<div class="compass" id="plan">${compassSvg(Object.assign({}, E || {regard:{lacet:0}, limite:50}, {ignorer:list, voix:null}))}</div><div class="note">Le robot est en bas, face vers le haut. En rouge : les directions ignorées.</div>`)
    + `<div class="card"><div class="card-title"><span>Directions ignorées${src()}</span></div><div class="rows">${rows}</div><div class="card-body" style="padding-top:0"><div class="note">L'ajout et le retrait arriveront avec l'assistant « Calibrer la pièce ».</div></div></div>`;
}
const soon = (title, text) => card(title, `<p class="empty" style="margin:0">${text}</p>`);
/* maison() : voir le bloc « MAISON » plus haut (lecture seule, lot 6). */

/* ---------- assemblage ---------- */
function render(){
  // La barre : les rubriques regroupées (Le robot, Les personnes, La maison), dans l'ordre de SECTIONS.
  // Sur mobile, la même barre devient un tiroir (bouton « ☰ » de l'en-tête).
  const groupes = Object.keys(GROUPES).map(g => [g, SECTIONS.filter(s => s.groupe === g)]).filter(([, l]) => l.length);
  document.getElementById('nav').innerHTML = `<div class="nav-head"><b>Rubriques</b><button class="icon-btn" type="button" id="nav-close" aria-label="Fermer les rubriques"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>` +
    groupes.map(([g, l]) => `<div class="nav-group" role="group" aria-labelledby="ng-${g}"><div class="nav-label" id="ng-${g}">${GROUPES[g]}</div>${l.map(s => `<a href="#${s.id}" data-nav="${s.id}">${ico(s.id)}<span>${s.title}</span></a>`).join('')}</div>`).join('') +
    `<div class="side-foot"><p>${R.ecriture ? 'Chaque changement est enregistré tout de suite et appliqué sans redémarrer.' : 'Lecture seule : les réglages s\'affichent, ils ne se changent pas encore ici.'}</p>
      <div class="legend-src" aria-label="Légende des sources"><span>${src()}réglé dans le robot</span><span>${src('ha')}réglé dans Home Assistant</span></div></div>`;
  const body = {
    live: live(),
    voir: settings('voir'),
    entendre: settings('entendre', {ha: [["Fin de phrase", "Combien de silence avant de considérer que la phrase est finie."]]}),
    parler: parlerVue(),                            // 11/10 : bloc PARLER plus haut
    toucher: settings('toucher', {after: touches()}),
    bouger: settings('bouger', {after: motors(), ha: [["Mode éco automatique", "Actif la nuit, ou quand les panneaux solaires ne produisent pas."], ["Mode éco maintenant", "L'état du mode éco ; le robot le suit (voir « En direct »)."]]}),
    piece: piece(),
    personnes: personnesVue() + settings('personnes'),   // lot 5 : bloc PERSONNES plus haut ; 11/10 : « Demander l'accord »
    apprendre: apprendreVue(),                      // 11/10 : bloc APPRENTISSAGE plus haut
    cameras: camerasVue() + settings('cameras'),    // 11/10 : bloc CAMÉRAS plus haut
    badges: badgesVue(),                            // 16/10 : bloc BADGES plus haut
    appareils: appareilsVue(),                      // 18/10 : les appareils appairés
    maison: maison(),
  };
  const open = [...document.querySelectorAll('details.expert[open]')].map(d => d.dataset.expert);
  document.getElementById('main').innerHTML =
    SECTIONS.map(s=>`<section class="section" id="sec-${s.id}" aria-labelledby="h-${s.id}"><div class="sec-head"><p class="sec-kicker">${GROUPES[s.groupe] || ''}</p><h2 id="h-${s.id}">${s.title}</h2><p>${s.intro}</p></div>${body[s.id]}</section>`).join('') +
    `<nav class="pager" id="pager" aria-label="Rubrique précédente ou suivante"></nav>`;
  open.forEach(id => { const d = document.querySelector(`details[data-expert="${id}"]`); if (d) d.open = true; });
  show(location.hash.slice(1));
  if (E) paint(E);
  if (current === 'parler') parlLit();
  asstMonter();                       // lot 4 : cartes « Calibrage » (bloc ASSISTANTS)
}
let current = 'live';
function show(id){
  if (!SECTIONS.some(s=>s.id===id)) id = 'live';
  current = id;
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active', s.id==='sec-'+id));
  document.querySelectorAll('#nav [data-nav]').forEach(a=>{ if (a.dataset.nav===id) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  document.querySelector(`#nav [data-nav="${id}"]`)?.scrollIntoView({block:'nearest'});
  const i = SECTIONS.findIndex(s => s.id === id), s = SECTIONS[i], av = SECTIONS[i - 1], ap = SECTIONS[i + 1];
  const top = document.getElementById('top-sec'); if (top) top.textContent = s.title;
  document.title = s.title + ' · Réglages du robot';
  const pager = document.getElementById('pager');
  if (pager) pager.innerHTML = (av ? `<a href="#${av.id}" data-nav="${av.id}" class="prev"><small>← Précédent</small>${av.title}</a>` : '')
    + (ap ? `<a href="#${ap.id}" data-nav="${ap.id}" class="next"><small>Suivant →</small>${ap.title}</a>` : '');
}
/* Le tiroir des rubriques (mobile) : bouton « ☰ », fond assombri, Échap ; le focus va au tiroir puis revient. */
function tiroir(ouvrir, rendreFocus = true){
  const btn = document.getElementById('menu'), nav = document.getElementById('nav');
  document.body.classList.toggle('nav-open', ouvrir);
  btn.setAttribute('aria-expanded', String(ouvrir));
  btn.setAttribute('aria-label', ouvrir ? 'Fermer les rubriques' : 'Ouvrir les rubriques');
  document.getElementById('scrim').hidden = !ouvrir;
  if (ouvrir) (nav.querySelector('[aria-current]') || nav.querySelector('a'))?.focus({preventScroll:true});
  else if (rendreFocus && nav.contains(document.activeElement)) btn.focus();
}
document.getElementById('menu').addEventListener('click', () => tiroir(!document.body.classList.contains('nav-open')));
document.getElementById('scrim').addEventListener('click', () => tiroir(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('nav-open')) tiroir(false); });
matchMedia('(max-width:860px)').addEventListener('change', e => { if (!e.matches) tiroir(false, false); });

/* ---------- le direct : 2 fois par seconde, seulement quand la page est visible ---------- */
const ago = s => s < 60 ? `il y a ${Math.round(s)} s` : `il y a ${Math.round(s/60)} min`;
function paint(e){
  const online = document.getElementById('online');
  online.className = 'pill ' + (e.joignable === false ? 'bad' : 'ok');
  online.lastElementChild.textContent = online.title = e.joignable === false ? 'Robot injoignable' : 'En ligne';
  const set = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t; };
  set('aware', e.conscience || 'Rien de particulier.');
  set('st-eveil', e.dort ? 'Endormi' : 'Éveillé');
  set('st-micro', e.muet ? 'Coupé' : 'Actif');
  set('st-eco', e.eco ? 'Actif' : 'Coupé');
  set('st-etat', ({idle:'Au repos', listening:'Écoute', thinking:'Réfléchit', speaking:'Parle', acting:'Agit', waiting:'Attend', error:'Erreur'})[e.etat] || e.etat);
  const log = document.getElementById('log');
  if (log) log.innerHTML = e.journal.length ? e.journal.map(([t,x]) => `<li><time>${esc(t)}</time><span>${esc(x)}</span></li>`).join('') : '<li class="empty">Rien pour l\'instant</li>';
  const tl = document.getElementById('touches');
  if (tl) tl.innerHTML = e.touchers.length ? e.touchers.map(([t,x]) => `<li><time>${esc(t)}</time><span>${esc(x)}</span></li>`).join('') : '<li class="empty">Aucun depuis le démarrage</li>';
  const c = document.getElementById('compass');
  if (c){ c.innerHTML = compassSvg(e); document.getElementById('compass-legend').innerHTML =
    `<span><i style="background:var(--accent)"></i>Regard <b>${deg(e.regard.lacet)}</b></span><span><i style="background:var(--warn)"></i>Dernière voix <b>${e.voix ? deg(e.voix.angle) + ' · ' + ago(e.voix.age) : '—'}</b></span><span><i style="background:var(--accent-soft)"></i>Portée de la tête ±${Math.round(e.limite)}°</span>`; }
  if (e.humeur){
    for (const k in e.humeur.jauges){ const v = e.humeur.jauges[k], f = document.querySelector(`[data-g="${k}"]`), n = document.querySelector(`[data-gn="${k}"]`); if (!f) continue;
      f.style.left = v >= 0 ? '50%' : (50 + v*50) + '%'; f.style.width = Math.abs(v)*50 + '%'; f.classList.toggle('neg', v < 0);
      n.textContent = (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2).replace('.', ','); }
    set('mood-word', e.humeur.mot.charAt(0).toUpperCase() + e.humeur.mot.slice(1));
  }
  const tag = document.getElementById('cam-tag'), over = document.getElementById('cam-over');
  if (tag){
    const v = e.vue;
    const cap = n => n.charAt(0).toUpperCase() + n.slice(1).replace(/-/g, ' ');
    const tous = v && v.presents && v.presents.length ? v.presents : (v && v.personne && v.personne !== 'inconnu' ? [v.personne] : []);
    const who = (tous.length ? ` · ${tous.map(cap).join(', ')} reconnu·e${tous.length > 1 ? 's' : ''}` : (v && v.personne === 'inconnu' ? ' · visage inconnu' : ''))
      + (v && v.animal ? ` · ${cap(v.animal)}` : '');   // 11/10 : toutes les personnes, et l'animal (chien, chat)
    tag.textContent = !v ? 'Pas de caméra' : v.erreur ? v.erreur : `Caméra · ${v.every ? Math.round(1 / v.every) : '?'} image(s)/s analysée(s)${who}`;
    over.innerHTML = !v || !v.visages ? '' : v.visages.map(([x,y]) => {
      const tracked = v.suivi && Math.hypot(v.suivi[0]-x, v.suivi[1]-y) < 0.15;
      return `<circle cx="${x}" cy="${y}" r=".07" fill="none" stroke="${tracked ? '#6f9bff' : '#e3a43b'}" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
    }).join('');
    set('cam-empty', v && v.image ? '' : (v ? 'Pas d\'image pour l\'instant' : 'Pas de caméra configurée'));
  }
  const m = document.getElementById('motors');
  if (m){
    const mo = e.moteurs, badge = document.getElementById('motors-badge');
    badge.className = 'badge ' + (e.joignable === false ? 'warn' : e.dort ? '' : 'ok');
    badge.textContent = e.joignable === false ? 'Injoignable' : e.dort ? 'Endormi' : 'Moteurs actifs';
    const cells = [];
    if (mo){
      if (mo.corps !== null) cells.push(['Corps', mo.corps]);
      mo.tete.forEach((v,i) => cells.push([`Tête ${i+1}`, v]));
      if (mo.antennes.length === 2) cells.push(['Antennes', `${deg(mo.antennes[0])} / ${deg(mo.antennes[1])}`]);
    }
    m.innerHTML = cells.length ? cells.map(([n,v]) => `<div class="motor"><b>${n}</b><span>${typeof v === 'number' ? (v>0?'+':v<0?'−':'') + Math.abs(v).toFixed(1).replace('.', ',') + '°' : esc(v)}</span></div>`).join('') : '<span class="empty">Pas encore relevés</span>';
    set('motors-note', mo ? `Position réelle, relevée ${ago(mo.age)} par le corps quand il guette un toucher.` : 'Relevés seulement quand le corps guette un toucher (au repos).');
  }
}
async function poll(){
  if (!document.hidden){
    try {
      const r = await fetch('/api/etat', {cache:'no-store'});
      if (r.ok){ E = await r.json(); paint(E); }
    } catch (_) {
      const o = document.getElementById('online'); o.className = 'pill bad'; o.lastElementChild.textContent = 'Corps injoignable';
    }
  }
  setTimeout(poll, 500);
}
let imageBusy = false;
function image(){
  const img = document.getElementById('cam-img');
  if (img && current === 'live' && !document.hidden && !imageBusy && E && E.vue && E.vue.image){
    imageBusy = true;
    const next = new Image();
    next.onload = () => { img.src = next.src; img.hidden = false; imageBusy = false; };
    next.onerror = () => { imageBusy = false; };
    next.src = '/api/image?t=' + Date.now() + appQ();
  }
  setTimeout(image, 1000);
}

/* ---------- enregistrement : à chaque changement, appliqué sans redémarrer ---------- */
let saveTimer;
function pill(kind, text){ const p = document.getElementById('save-pill'); p.className = 'pill' + (kind ? ' ' + kind : ''); p.querySelector('.txt').textContent = text; }
/* 11/10 : le jeton de la page vit en mémoire du corps ; après un redémarrage du robot, une page déjà ouverte est
   « périmée ». Plutôt que de laisser l'erreur, la page le dit et se recharge (une fois : jamais en boucle). */
function perimee(r, data){
  if (r.status !== 403 || !/périmée/.test(data.erreur || '')) return '';
  let deja = false;
  try { deja = sessionStorage.getItem('rechargee') === '1'; sessionStorage.setItem('rechargee', '1'); } catch (_) {}
  if (deja) return 'page périmée : la recharger';
  setTimeout(() => location.reload(), 1500);
  return 'le robot a redémarré : la page se recharge, refaire le geste';
}
try { setTimeout(() => sessionStorage.removeItem('rechargee'), 10000); } catch (_) {}
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600); }
async function save(changes, label){
  pill('info', 'Enregistrement…');
  try {
    const r = await fetch('/api/reglages', {method:'POST', cache:'no-store',
      headers:{'Content-Type':'application/json', 'X-Reachy-Jeton': JETON}, body: JSON.stringify({valeurs: changes})});
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(perimee(r, data) || data.erreur || ('erreur ' + r.status));
    R.valeurs = data.valeurs;
    clearTimeout(saveTimer);
    pill('ok', 'Enregistré');
    toast(`${label} — enregistré et appliqué, sans redémarrer`);
    saveTimer = setTimeout(() => pill('', 'Tout est enregistré'), 2500);
  } catch (err) {
    pill('bad', 'Non enregistré');
    toast(`${label} : ${err.message}`);
  }
  refreshRows(Object.keys(changes));
}
function refreshRows(keys){
  const touched = new Set(keys);
  for (const r of R.schema) if (r.depend && touched.has(r.depend)) touched.add(r.cle);
  for (const k of touched){ const el = document.querySelector(`[data-row="${k}"]`); if (el && BY[k]) el.outerHTML = row(BY[k]); }
}
document.addEventListener('input', e => {
  const id = e.target.dataset.id; if (!id || !BY[id]) return; const r = BY[id];
  if (r.type === 'nombre'){ const v = Number(e.target.value); e.target.style.setProperty('--p', pct(v, r)); document.querySelector(`[data-val="${id}"]`).textContent = fmt(v, r); }
  if (r.type === 'plage'){
    const both = [...document.querySelectorAll(`[data-id="${id}"]`)], i = +e.target.dataset.i, v = Number(e.target.value);
    const o = both.map(s => Number(s.value)); if (o[0] > o[1]) { o[1-i] = v; both[1-i].value = v; }
    both.forEach((s, j) => s.style.setProperty('--p', pct(o[j], r)));
    document.querySelector(`[data-val="${id}"]`).textContent = fmt(o, r);
  }
});
document.addEventListener('change', e => {
  const id = e.target.dataset.id; if (!id || !BY[id] || !R.ecriture) return; const r = BY[id];
  let v;
  if (r.type === 'interrupteur') v = e.target.checked;
  else if (r.type === 'nombre') v = Number(e.target.value);
  else if (r.type === 'plage') v = [...document.querySelectorAll(`[data-id="${id}"]`)].map(s => Number(s.value)).sort((a,b)=>a-b);
  else if (r.type === 'heure' || r.type === 'choix') v = e.target.value;
  save({[id]: v}, r.intitule);
});
document.addEventListener('click', e => {
  const b = e.target.closest('button,a'); if (!b) return;
  if (b.dataset.nav){
    e.preventDefault(); history.replaceState(null, '', '#' + b.dataset.nav); show(b.dataset.nav); window.scrollTo({top:0});
    const tiroirOuvert = document.body.classList.contains('nav-open');
    if (tiroirOuvert) tiroir(false, false);
    // Le focus suit la rubrique : depuis le tiroir, le bas de page, ou au clavier (la souris dans la barre le laisse).
    if (tiroirOuvert || !b.closest('#nav') || e.detail === 0) document.getElementById('main').focus({preventScroll:true});
    return;
  }
  if ('skip' in b.dataset){ e.preventDefault(); document.getElementById('main').focus(); return; }
  if (b.id === 'nav-close'){ tiroir(false); return; }
  if (b.dataset.reset){ const r = BY[b.dataset.reset]; save({[r.cle]: null}, r.intitule + ' : valeur d\'origine'); return; }
  if (b.id === 'theme'){ const root = document.documentElement; const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('theme', root.dataset.theme); } catch (_) {} }
});
window.addEventListener('hashchange', () => show(location.hash.slice(1)));

let appairageVisible = false;
function appairageMontrer(message){
  if (appairageVisible && !message) return;
  appairageVisible = true;
  document.getElementById('nav').innerHTML = '';
  document.getElementById('main').innerHTML = `<section class="section active" aria-labelledby="h-appairage"><div class="card">
    <div class="card-title"><span id="h-appairage">Appairer cet appareil</span></div><div class="card-body">
    <p>Cette page règle le robot et montre ce qu'il voit : chaque appareil s'appaire une fois. Demandez un code : le robot le dit à voix haute (sans voix, il est écrit au journal de la machine du robot).</p>
    <div class="app-form">
      <div><button class="pers-btn" type="button" id="app-demander">1 · Demander un code</button></div>
      <label for="app-code">2 · Le code dit par le robot (6 chiffres)</label>
      <input type="text" id="app-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
      <label for="app-nom">3 · Le nom de cet appareil</label>
      <input type="text" id="app-nom" maxlength="40" placeholder="Téléphone, tablette du salon…">
      <div><button class="pers-btn" type="button" id="app-valider">Appairer</button></div>
    </div>
    <p id="app-msg" role="status">${esc(message || '')}</p>
    </div></div></section>`;
  const msg = t => { const m = document.getElementById('app-msg'); if (m) m.textContent = t; };
  const poster = (chemin, donnees) => fetch(chemin, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Reachy-Jeton': JETON},
                                                      body: JSON.stringify(donnees || {})}).then(async r => [r.ok, await r.json().catch(() => ({}))]);
  document.getElementById('app-demander').onclick = async () => {
    const [ok, rep] = await poster('/api/appairage/demander');
    msg(ok ? (rep.voix ? 'Le robot dit le code à voix haute (valable 3 minutes).' : 'Code écrit au journal de la machine du robot (valable 3 minutes).')
           : (rep.erreur || 'Demande refusée.'));
  };
  document.getElementById('app-valider').onclick = async () => {
    const [ok, rep] = await poster('/api/appairage/valider', {code: document.getElementById('app-code').value, nom: document.getElementById('app-nom').value});
    if (!ok || !rep.jeton) { msg(rep.erreur || 'Code refusé.'); return; }
    APPAREIL = rep.jeton;
    try { localStorage.setItem('reachy-appareil', rep.jeton); location.reload(); }
    catch (_) {
      // Stockage refusé (cadre d'un autre site, navigation privée) : le jeton vit le temps de la visite.
      appairageVisible = false;
      msg('Appairé pour cette visite seulement : ce navigateur refuse de garder le jeton. Ouvrez la page directement (son adresse) pour un appairage durable.');
      setTimeout(start, 1500);
    }
  };
}

async function start(){
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
  // Pas encore appairé (ou jeton révoqué) : l'écran d'appairage, rien d'autre ne se charge.
  try {
    const etat = await (await fetch('/api/appairage/etat', {cache: 'no-store'})).json();
    if (!etat.appaire) { appairageMontrer(); return; }
  } catch (_) {}
  try {
    const r = await fetch('/api/reglages', {cache:'no-store'});
    R = await r.json();
  } catch (_) {
    document.getElementById('main').innerHTML = '<p class="empty">Le corps du robot ne répond pas. Recharger la page dans un instant.</p>';
    return;
  }
  for (const r of R.schema) BY[r.cle] = r;
  if (!R.ecriture) pill('', 'Lecture seule');
  render();
  poll();
  image();
}
start();
</script>
