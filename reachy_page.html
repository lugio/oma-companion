<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réglages du robot</title>
<link rel="icon" href="data:,">
<meta name="description" content="Réglages du robot Reachy Mini, servis par son corps sur le réseau local.">
<!-- Page de réglages du robot (11/10/2026), servie par reachy_page.py. Aucune dépendance externe. -->
<style>
/* Refonte du 12/10/2026 : rubriques regroupées, tiroir sur mobile, contrastes AA (clair et sombre), échelle
   d'espacements et de tailles, focus visibles, animations courtes (coupées si « réduire les animations »). */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --line:#e2e5ea; --line-2:#cfd4dc;
  --text:#1b1e24; --muted:#5f6673; --faint:#646b77;
  --accent:#3b6fd8; --accent-soft:#e6eefc; --accent-text:#2550a8; --on-accent:#ffffff;
  --ok:#17703d; --ok-soft:#e3f4ea; --warn:#8a5600; --warn-soft:#fbf0db; --bad:#b02e2e; --bad-soft:#fbe5e5;
  --track:#d9dde4; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 12px 40px rgba(16,24,40,.18);
  --ha:#086a86; --ha-soft:#dff2f8;
  --r:12px; --r-sm:8px;
  /* une seule échelle d'espacements */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  /* tailles de texte (les titres suivent la largeur de l'écran) */
  --fs-xs:12.5px; --fs-sm:13.5px; --fs-md:15px; --fs-lg:17px; --fs-h2:clamp(21px,1.05rem + .8vw,27px);
  --tap:44px;                                   /* cible tactile minimale */
  --ease:cubic-bezier(.2,.7,.2,1); --t:.16s;
  --top-h:65px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --surface:#181b21; --surface-2:#1f232a; --line:#2a2f38; --line-2:#3a404b;
    --text:#e7e9ee; --muted:#a3a9b4; --faint:#868d99;
    --accent:#6f9bff; --accent-soft:#1d2a45; --accent-text:#a9c3ff; --on-accent:#0b1530;
    --ok:#4cc581; --ok-soft:#17301f; --warn:#e3a43b; --warn-soft:#33270f; --bad:#ef6f6f; --bad-soft:#3a1a1a;
    --track:#323844; --shadow:none; --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark; --ha:#5cc8e6; --ha-soft:#123039;
  }
}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#181b21; --surface-2:#1f232a; --line:#2a2f38; --line-2:#3a404b;
  --text:#e7e9ee; --muted:#a3a9b4; --faint:#868d99;
  --accent:#6f9bff; --accent-soft:#1d2a45; --accent-text:#a9c3ff; --on-accent:#0b1530;
  --ok:#4cc581; --ok-soft:#17301f; --warn:#e3a43b; --warn-soft:#33270f; --bad:#ef6f6f; --bad-soft:#3a1a1a;
  --track:#323844; --shadow:none; --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark; --ha:#5cc8e6; --ha-soft:#123039;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:var(--fs-md)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button,a,summary,select,input{-webkit-tap-highlight-color:transparent}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main:focus{outline:none}
.skip{position:absolute;left:var(--s4);top:-60px;z-index:60;padding:10px 14px;border-radius:var(--r-sm);background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none}
.skip:focus{top:var(--s2)}

/* barre du haut */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:var(--s3) var(--s5);display:flex;align-items:center;gap:var(--s3);min-height:var(--top-h)}
.brand{display:flex;align-items:center;gap:var(--s3);min-width:0}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.brand > div:last-child{min-width:0}
.brand h1{font-size:16px;margin:0;font-weight:650;white-space:nowrap;line-height:1.3}
.brand p{margin:0;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sec{display:none}
.top-right{margin-left:auto;display:flex;align-items:center;gap:var(--s2);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:var(--fs-sm);font-weight:550;background:var(--surface-2);color:var(--muted);white-space:nowrap;transition:background var(--t),color var(--t)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent-text)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;transition:color var(--t),background var(--t),border-color var(--t)}
.icon-btn:hover{color:var(--text);border-color:var(--line-2)}
.menu-btn{display:none}

/* mise en page : rubriques à gauche, contenu à largeur de lecture */
.layout{max-width:1240px;margin:0 auto;padding:var(--s5);display:grid;grid-template-columns:232px minmax(0,1fr);gap:var(--s6) 40px;align-items:start}
nav.side{position:sticky;top:calc(var(--top-h) + var(--s5));max-height:calc(100vh - var(--top-h) - var(--s6));overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:var(--s4);scrollbar-width:thin}
.nav-head{display:none}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{padding:0 var(--s3) var(--s1);font-size:var(--fs-xs);font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
nav.side a{display:flex;align-items:center;gap:var(--s3);min-height:40px;padding:8px var(--s3);border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:550;font-size:14.5px;transition:background var(--t),color var(--t)}
nav.side a:hover{background:var(--surface-2);color:var(--text)}
nav.side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
nav.side a svg{flex:none;width:18px;height:18px}
.side-foot{padding:var(--s3);border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--faint);line-height:1.45;display:flex;flex-direction:column;gap:var(--s3)}
.side-foot p{margin:0}
.scrim{display:none}
main{min-width:0;max-width:920px}
main#main{width:100%}
.sec-head{margin:0 0 var(--s5)}
.sec-kicker{margin:0 0 var(--s1);font-size:var(--fs-xs);font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-text)}
.sec-head h2{font-size:var(--fs-h2);line-height:1.2;margin:0 0 6px;font-weight:680;letter-spacing:-.015em}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card + .card,.card + .expert,.expert + .card{margin-top:var(--s4)}
.card-title{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--s2) var(--s3);padding:var(--s4) var(--s5) 0;font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card-body{padding:var(--s4) var(--s5) var(--s5)}
.card-title .badge{text-transform:none;letter-spacing:0}

/* lignes de réglage : une seule forme partout */
.rows{padding:0 var(--s5)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,280px);gap:var(--s5);align-items:center;padding:var(--s4) 0;border-top:1px solid var(--line)}
.rows .row:first-child{border-top:0}
.row-label{font-weight:600}
.row-help{color:var(--muted);font-size:var(--fs-sm);margin-top:2px;max-width:56ch}
.row-ctl{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
.row-ctl .line{display:flex;align-items:center;gap:var(--s3);width:100%;justify-content:flex-end}
.row.off{opacity:.6}
.reset{background:none;border:0;padding:2px 0;font-size:var(--fs-xs);font-weight:600;color:var(--accent-text);cursor:pointer;border-radius:4px}
.reset:hover{text-decoration:underline}
.reset:disabled{opacity:.5;cursor:default;text-decoration:none}
.ro{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.ro small{display:block;font-weight:500;color:var(--faint);font-size:12px}

/* interrupteur */
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw input:disabled{cursor:default}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--track);transition:background var(--t)}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform var(--t) var(--ease)}
.sw input:checked + span{background:var(--accent)}
.sw input:checked + span::after{transform:translateX(18px)}
.sw input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.sw-state{font-size:var(--fs-sm);color:var(--muted);min-width:44px;text-align:right}

/* curseur */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer;min-width:0}
input[type=range]:disabled{cursor:default}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,50%) 100% no-repeat,var(--track)}
input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--track)}
input[type=range]::-moz-range-progress{height:6px;border-radius:999px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--accent);margin-top:-6px;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform var(--t)}
input[type=range]:not(:disabled):hover::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.val{flex:none;min-width:74px;text-align:center;padding:3px 8px;border-radius:var(--r-sm);background:var(--surface-2);font-weight:600;font-size:var(--fs-sm);font-variant-numeric:tabular-nums;white-space:nowrap}
.pair{display:grid;grid-template-columns:auto 1fr;gap:4px var(--s2);align-items:center;width:100%;font-size:13px;color:var(--muted)}
input[type=time]{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 8px;font-variant-numeric:tabular-nums}

/* réglages d'expert : repliés */
.expert{border:1px dashed var(--line-2);border-radius:var(--r);background:transparent;transition:background var(--t)}
.expert > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:var(--s2);min-height:var(--tap);padding:var(--s2) var(--s5);color:var(--muted);font-weight:600;font-size:14px;border-radius:var(--r)}
.expert > summary:hover{color:var(--text)}
.expert > summary::-webkit-details-marker{display:none}
.expert > summary svg{transition:transform var(--t) var(--ease)}
.expert[open] > summary svg{transform:rotate(90deg)}
.expert[open]{background:var(--surface);border-style:solid;border-color:var(--line)}
.expert .rows{padding-bottom:var(--s2)}
.expert .group{padding:var(--s3) var(--s5) 0;font-size:var(--fs-xs);font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
.expert .group + .rows .row:first-child{border-top:0}

.note{font-size:13px;color:var(--muted);margin-top:var(--s3)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.info{background:var(--accent-soft);color:var(--accent-text)}

/* source : Robot ou Home Assistant (une seule façon, partout) */
.src{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:1px 7px 1px 5px;border-radius:6px;font-size:11.5px;font-weight:600;line-height:18px;vertical-align:2px;text-transform:none;letter-spacing:0;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.src svg{width:12px;height:12px}
.src.ha{background:var(--ha-soft);color:var(--ha)}
.legend-src{display:flex;flex-direction:column;gap:var(--s2);margin:0;font-size:var(--fs-xs);color:var(--muted)}
.legend-src .src{margin-left:0;margin-right:6px}
.legend-src > span{display:flex;align-items:center;flex-wrap:wrap}
.ha-link{font-size:13px;font-weight:600;color:var(--ha);text-decoration:none;text-transform:none;letter-spacing:0;white-space:nowrap;border-radius:4px}
.ha-link:hover{text-decoration:underline}

/* en direct */
.live{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:var(--s4)}
.live > div{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.live .card{margin:0}
.cam{position:relative;aspect-ratio:16/9;border-radius:var(--r-sm);overflow:hidden;background:#1a1d23}
.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam svg.over{position:absolute;inset:0;width:100%;height:100%}
.cam-empty{position:absolute;inset:0;display:grid;place-items:center;color:#aeb4bf;font-size:14px;text-align:center;padding:var(--s4)}
.cam-tag{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px}
.cam-tag .badge{background:rgba(0,0,0,.6);color:#fff;white-space:normal}
.status-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.status-item{background:var(--surface-2);border-radius:var(--r-sm);padding:var(--s2) var(--s3);min-width:0}
.status-item b{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:2px;font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.status-item b .src{margin-left:0}
.status-item span{font-weight:600}
.aware{font-size:var(--fs-lg);line-height:1.5;margin:0}
.aware-meta{font-size:var(--fs-xs);color:var(--faint);margin-top:var(--s2)}
.gauges{display:flex;flex-direction:column;gap:var(--s3)}
.gauge{display:grid;grid-template-columns:64px 1fr 44px;gap:var(--s3);align-items:center;font-size:14px}
.gauge-bar{position:relative;height:8px;border-radius:999px;background:var(--track)}
.gauge-bar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--faint)}
.gauge-fill{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--accent);transition:all .8s ease}
.gauge-fill.neg{background:var(--warn)}
.gauge-num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.mood-label{margin-bottom:var(--s3);font-size:16px;font-weight:600}
.log{list-style:none;margin:0;padding:0;font-size:var(--fs-sm);max-height:248px;overflow:auto}
.log li{display:grid;grid-template-columns:68px minmax(0,1fr);gap:var(--s3);padding:6px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.log li:first-child{border-top:0}
.log time{color:var(--faint);font-variant-numeric:tabular-nums}
.compass svg{width:100%;height:auto;max-height:220px}
.legend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{color:var(--faint);font-size:14px}

/* moteurs */
.motors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.motor{background:var(--surface-2);border-radius:var(--r-sm);padding:var(--s2) var(--s3)}
.motor b{display:block;font-size:12px;color:var(--faint);font-weight:600}
.motor span{font-weight:650;font-variant-numeric:tabular-nums}

/* rubrique précédente / suivante */
.pager{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);margin-top:var(--s6)}
.pager a{display:flex;flex-direction:column;gap:2px;min-height:56px;justify-content:center;padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);text-decoration:none;font-weight:600;transition:border-color var(--t),background var(--t)}
.pager a:hover{border-color:var(--accent);background:var(--accent-soft)}
.pager a small{font-size:var(--fs-xs);font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.pager a.next{grid-column:2;text-align:right;align-items:flex-end}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:550;transition:opacity .2s,transform .2s var(--ease);max-width:calc(100vw - 32px);z-index:50;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.section{display:none}
.section.active{display:block;animation:sec-in .18s var(--ease)}
@keyframes sec-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

@media (max-width:1100px){ .live{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  :root{--top-h:57px}
  .top-in{padding:var(--s2) var(--s4);gap:var(--s2)}
  .menu-btn{display:grid;width:var(--tap);height:var(--tap)}
  .brand-mark{display:none}
  .brand h1{font-size:15px}
  .brand-sub{display:none}
  .top-sec{display:inline;color:var(--accent-text);font-weight:600}
  .top-right .icon-btn{width:var(--tap);height:var(--tap)}
  #save-pill .txt{display:none}
  #save-pill{padding:8px}
  #online .lbl{display:none}
  #online{padding:8px}
  /* le tiroir des rubriques */
  .layout{grid-template-columns:minmax(0,1fr);padding:var(--s4) var(--s4) calc(var(--s6) + env(safe-area-inset-bottom));gap:0}
  nav.side{position:fixed;top:0;bottom:0;left:0;z-index:40;width:min(320px,86vw);max-height:none;padding:var(--s3) var(--s3) calc(var(--s5) + env(safe-area-inset-bottom));gap:var(--s4);background:var(--surface);border-right:1px solid var(--line);box-shadow:var(--shadow-lg);transform:translateX(-102%);visibility:hidden;transition:transform .22s var(--ease),visibility 0s linear .22s}
  body.nav-open nav.side{transform:none;visibility:visible;transition:transform .22s var(--ease)}
  body.nav-open{overflow:hidden}
  .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(10,12,16,.5);animation:scrim-in .2s ease}
  .scrim[hidden]{display:none}
  @keyframes scrim-in{from{opacity:0}to{opacity:1}}
  .nav-head{display:flex;align-items:center;justify-content:space-between;padding:0 0 0 var(--s3)}
  .nav-head b{font-size:16px}
  .nav-head .icon-btn{width:var(--tap);height:var(--tap)}
  nav.side a{min-height:var(--tap);font-size:15px}
  main{max-width:none}
  .sec-head{margin-bottom:var(--s4)}
  .row{grid-template-columns:minmax(0,1fr);gap:var(--s3)}
  .row-ctl{align-items:stretch}
  .row-ctl .line{justify-content:flex-start;flex-wrap:wrap}
  .row.row-switch{grid-template-columns:minmax(0,1fr) auto}
  .row.row-switch .row-ctl{align-items:flex-end}
  .row.row-switch .sw-state{display:none}
  .sw input{inset:-9px -6px}
  input[type=range]{height:var(--tap);flex:1 1 140px}
  input[type=range]::-webkit-slider-thumb{width:24px;height:24px;margin-top:-9px}
  input[type=time],select{min-height:var(--tap)}
  .reset{align-self:flex-start;min-height:var(--tap);display:inline-flex;align-items:center}
  .ro{text-align:left}
  .motors{grid-template-columns:repeat(2,minmax(0,1fr))}

<!-- ASSISTANTS : début -->

<style>

.asst-btn:hover:not(:disabled){background:var(--surface-2)}

.asst-btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.asst-btn:disabled{opacity:.45;cursor:default}
.asst-btn:focus-visible,.asst-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.asst-dlg{padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.asst-dlg::backdrop{background:rgba(10,12,16,.55)}
.asst-wz{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
.asst-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3)}
.asst-head h3{margin:0;font-size:18px}
.asst-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.asst-steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.asst-steps i{height:4px;border-radius:999px;background:var(--track)}

.asst-steps i.now{background:var(--accent);opacity:.5}
.asst-kicker{font-size:12.5px;font-weight:650;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.asst-say{font-size:17px;line-height:1.45;margin:4px 0 0}
.asst-measure{background:var(--surface-2);border-radius:var(--r-sm);padding:var(--s3) var(--s4)}
.asst-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin-bottom:var(--s2);font-size:12.5px;font-weight:650;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.asst-bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden}
.asst-bar b{display:block;height:100%;width:0;background:var(--accent);transition:width .4s linear}

.asst-table td + td,.asst-table th + th{text-align:right;padding-left:var(--s3);white-space:nowrap}

.asst-box.ok b{color:var(--ok)}

<dialog class="asst-dlg" id="asst-dlg" aria-labelledby="asst-titre"><div class="asst-wz" id="asst-body"></div></dialog>
<script>
'use strict';
const ASST = {cat: null, repris: false, vue: '', timer: null};
async function asstApi(chemin, corps){
  const options = corps === undefined ? {cache:'no-store'} : {method:'POST', cache:'no-store',
    headers:{'Content-Type':'application/json', 'X-Reachy-Jeton': JETON}, body: JSON.stringify(corps)};
  const r = await fetch(chemin, options);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(perimee(r, data) || data.erreur || ('erreur ' + r.status));
  return data;
}
function asstCarte(a){
  const pret = a.disponible;
  return `<div class="card" data-asst-card="${esc(a.id)}"><div class="card-title"><span>Calibrage${src()}</span></div><div class="card-body"><div class="asst-calib"><div>
    <h3>${esc(a.titre)}</h3><p>${esc(a.intro)}</p>
    <dl><dt>Mesure</dt><dd>${esc(a.mesure)}</dd><dt>Écrit</dt><dd>${esc(a.ecrit)}</dd></dl>
    ${pret ? '' : `<div class="asst-why">Indisponible : ${esc(a.raison)}.</div>`}</div>
    <div><button class="asst-btn primary" data-asst="${esc(a.id)}" ${pret ? '' : 'disabled'}>Lancer l'assistant</button></div></div></div></div>`;
}
/* Les cartes se glissent dans leur rubrique : après les réglages essentiels (Voir, Toucher), à la fin (Pièce). */
async function asstMonter(){
  if (!ASST.cat){
    try { ASST.cat = (await asstApi('/api/assistants')).assistants; } catch (_) { return; }
  }
  for (const a of ASST.cat){
    const section = document.getElementById('sec-' + a.rubrique);
    if (!section) continue;
    section.querySelector(`[data-asst-card="${a.id}"]`)?.remove();
    const premiere = section.querySelector(':scope > .card');
    if (a.rubrique === 'piece' || !premiere) section.insertAdjacentHTML('beforeend', asstCarte(a));
    else premiere.insertAdjacentHTML('afterend', asstCarte(a));
  }
  if (!ASST.repris){            // page rechargée pendant un assistant : on le retrouve
    ASST.repris = true;
    try {
      const {session} = await asstApi('/api/assistants/session');
      if (session && ['preparation', 'mesure', 'resultat'].includes(session.etat)) asstOuvrir(session);
    } catch (_) {}
  }
}
const asstNb = s => s.etapes.length;
function asstEntete(s){
  const fini = s.etat !== 'preparation' && s.etat !== 'mesure';
  const lieu = {voir:'Voir', toucher:'Toucher', piece:'Pièce'}[s.rubrique] || s.rubrique;
  const barre = [...s.etapes, 0].map((_, i) => `<i class="${fini || i < s.etape ? 'done' : i === s.etape ? 'now' : ''}"></i>`).join('');
  const place = s.etat === 'resultat' || s.etat === 'applique' ? 'Résultat' : s.etat === 'mesure' ? `Étape ${s.etape + 1} sur ${asstNb(s)}` : 'Préparation';
  return `<div class="asst-head"><div><h3 id="asst-titre">${esc(s.titre)}</h3><p>${place} · lancé depuis ${lieu}</p></div>${src()}</div><div class="asst-steps">${barre}</div>`;
}
function asstCorps(s){
  const tete = asstEntete(s);
  if (s.etat === 'preparation')
    return tete + `<p class="asst-say">Le robot finit son mouvement, puis ne bougera plus de lui-même pendant la mesure…</p>
      <div class="asst-foot"><button class="asst-link" data-act="annuler">Annuler</button></div>`;
  if (s.etat === 'mesure')
    return tete + `<div><div class="asst-kicker">Consigne</div><p class="asst-say">${esc(s.etapes[s.etape])}</p></div>
      <div class="asst-measure"><div class="asst-top"><span>Mesure en direct</span><span class="badge info" id="asst-badge">en cours</span></div>
        <div class="asst-bar"><b id="asst-barre"></b></div><div class="asst-value" id="asst-valeur">…</div><div class="asst-alert" id="asst-alerte" hidden></div></div>
      <div class="asst-foot"><button class="asst-link" data-act="annuler">Annuler</button><span class="asst-gap"></span>
        <button class="asst-btn" data-act="recommencer">Recommencer l'étape</button>
        <button class="asst-btn primary" data-act="suivant" id="asst-suivant" disabled>C'est fait</button></div>
      <div class="asst-small" id="asst-reste"></div>`;
  if (s.etat === 'resultat' || s.etat === 'applique'){
    const r = s.resultat, applique = s.etat === 'applique';
    const change = r.lignes.some(l => l.change);
    const lignes = r.lignes.map(l => `<tr><td>${esc(l.libelle)}</td><td class="same">${esc(l.actuel)}</td><td class="${l.change ? 'new' : 'same'}">${esc(l.propose)}</td></tr>`).join('');
    const ecrit = r.ecrit.map(t => `<li>${esc(t)} ${src()}</li>`).join('');
    const bas = applique
      ? `<div class="asst-box ok"><b>Appliqué.</b><br>${s.ecrit.length ? 'Une sauvegarde de vivant.json a été faite, puis les réglages ont été appliqués sans redémarrer. « Valeur d\'origine » reste possible dans la rubrique.' : 'Rien n\'avait besoin de changer.'}</div>
         <div class="asst-foot"><span class="asst-gap"></span><button class="asst-btn primary" data-act="fermer">Fermer</button></div>`
      : `<div class="asst-foot"><button class="asst-link" data-act="annuler">Annuler</button><span class="asst-gap"></span>
           <button class="asst-btn" data-act="tout">Tout recommencer</button>
           <button class="asst-btn primary" data-act="appliquer">${change ? 'Appliquer' : 'Terminer'}</button></div>
         <div class="asst-small">« Appliquer » fait d'abord une sauvegarde ; « Valeur d'origine » reste possible ensuite.</div>`;
    return tete + `<div class="asst-box ${r.ton}"><b>${esc(r.titre)}</b><br>${esc(r.texte)}</div>
      <table class="asst-table"><thead><tr><th>Réglage</th><th>Actuel</th><th>Proposé</th></tr></thead><tbody>${lignes}</tbody></table>
      <div><div class="asst-kicker">${applique ? 'Écrit' : 'Sera écrit'}</div><ul class="asst-writes">${ecrit}</ul></div>` + bas;
  }
  const dit = s.etat === 'interrompue' ? 'La mesure a été interrompue.' : 'Assistant fermé.';
  return `<div class="asst-head"><div><h3 id="asst-titre">${esc(s.titre)}</h3><p>${dit}</p></div></div>
    <div class="asst-box warn"><b>${dit}</b><br>${esc(s.raison || 'Rien n\'a été changé.')} Rien n'a été changé.</div>
    <div class="asst-foot"><span class="asst-gap"></span><button class="asst-btn" data-act="fermer">Fermer</button><button class="asst-btn primary" data-act="tout">Recommencer</button></div>`;
}
function asstPeindre(s){
  const dlg = document.getElementById('asst-dlg');
  if (!s || s.etat === 'annule'){ asstFermer(false); return; }
  const cle = s.etat + ':' + s.etape;
  if (cle !== ASST.vue){ ASST.vue = cle; document.getElementById('asst-body').innerHTML = asstCorps(s); }
  if (s.etat === 'mesure' && s.mesure){
    const m = s.mesure, badge = document.getElementById('asst-badge');
    badge.className = 'badge ' + (m.suffisante ? 'ok' : 'info');
    badge.textContent = m.suffisante ? 'mesure suffisante' : 'en cours';
    document.getElementById('asst-barre').style.width = Math.round(m.progres * 100) + '%';
    document.getElementById('asst-valeur').textContent = m.texte;
    const alerte = document.getElementById('asst-alerte');
    alerte.hidden = !m.alerte; alerte.textContent = m.alerte;
    document.getElementById('asst-suivant').disabled = !m.suffisante;
    document.getElementById('asst-reste').textContent = s.reste === null ? '' : `Le robot ne bouge pas de lui-même pendant la mesure ; il reprend seul dans ${s.reste} s au plus.`;
  }
  if (!dlg.open) dlg.showModal();
}
function asstSuivre(){
  clearInterval(ASST.timer);
  ASST.timer = setInterval(async () => {
    try { asstPeindre((await asstApi('/api/assistants/session')).session); } catch (_) {}
  }, 500);
}
function asstOuvrir(s){ ASST.vue = ''; asstPeindre(s); asstSuivre(); }
function asstFermer(prevenir){
  clearInterval(ASST.timer); ASST.vue = '';
  const dlg = document.getElementById('asst-dlg');
  if (dlg.open) dlg.close();
  if (prevenir) toast('Calibrage annulé : rien n\'a été changé');
}
async function asstLancer(id){
  try { asstOuvrir((await asstApi('/api/assistants/lancer', {assistant: id})).session); }
  catch (err) { toast(err.message); }
}
async function asstAction(act){
  try {
    if (act === 'fermer'){ asstFermer(false); return; }
    if (act === 'annuler'){ await asstApi('/api/assistants/annuler', {}); asstFermer(true); return; }
    const route = {recommencer:'recommencer', suivant:'suivant', appliquer:'appliquer', tout:'recommencer'}[act];
    const {session} = await asstApi('/api/assistants/' + route, {});
    ASST.vue = '';
    asstPeindre(session);
    if (act === 'appliquer'){
      pill('ok', 'Enregistré');
      toast(`${session.titre} — enregistré et appliqué, sans redémarrer`);
      setTimeout(() => pill('', 'Tout est enregistré'), 2500);
      try { R = await (await fetch('/api/reglages', {cache:'no-store'})).json(); render(); } catch (_) {}   // les réglages ont changé
    }
  } catch (err) { toast(err.message); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.asst) asstLancer(b.dataset.asst);
  else if (b.dataset.act && b.closest('#asst-dlg')) asstAction(b.dataset.act);
});
/* Échap = Annuler : la mesure s'arrête et le robot reprend sa vie. */
document.getElementById('asst-dlg').addEventListener('cancel', e => { e.preventDefault(); asstAction('annuler'); });
</script>

<script>
'use strict';
/* Les fiches viennent de GET /api/personnes ; les gestes passent par POST (même jeton que les réglages). */
let P = null;                 // {personnes, dossiers, camera, ecriture, tache}
let persTimer = null;
const persDate = iso => { try { return new Date(iso).toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'}); } catch (_) { return ''; } };
const persHeure = iso => { try { return new Date(iso).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}); } catch (_) { return ''; } };
async function persPost(chemin, corps){
  const r = await fetch('/api/personnes/' + chemin, {method:'POST', cache:'no-store',
    headers:{'Content-Type':'application/json', 'X-Reachy-Jeton': JETON}, body: JSON.stringify(corps)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(perimee(r, data) || data.erreur || ('erreur ' + r.status));
  return data;
}
async function persCharger(){
  const racine = document.getElementById('pers-root');
  if (!racine) return;
  try {
    const r = await fetch('/api/personnes', {cache:'no-store'});
    if (!r.ok) throw new Error();
    P = await r.json();
  } catch (_) {
    racine.innerHTML = '<p class="empty">Le robot ne répond pas. Réessayer dans un instant.</p>';
    return;
  }
  racine.innerHTML = persFiches();
}
const persBadge = (ok, oui, non) => ok ? `<span class="badge ok">${esc(oui)}</span>` : `<span class="badge">${esc(non)}</span>`;
function persFiche(p){
  const v = p.visage, x = p.voix, av = p.accord.visage, ax = p.accord.voix;
  const nbV = v && v.nombre ? `${v.nombre} vues` : 'enregistré';
  const nbX = x && x.nombre ? `${x.nombre} phrases` : 'enregistrée';
  const accord = (a, existe, nom) => a ? `<span class="badge ok">${esc(persDate(a.le))}</span><small>donné par ${esc(a.par)}${a.apres_coup ? ' · noté après coup' : ''}</small>`
    : existe ? `<span class="badge warn">non noté</span><small><button class="pers-link" data-pers-accord="${p.nom}" data-genre="${nom}">Noter l'accord</button></small>` : '<span class="badge">—</span>';
  const connu = v || x;
  const ha = (e, lien) => `<code>${esc(e)}</code><small>à lire dans Home Assistant${R.ha ? ` · <a class="ha-link" href="${esc(R.ha + lien)}" target="_blank" rel="noopener">ouvrir ↗</a>` : ''}</small>`;
  const nom = esc(p.affiche);
  return `<div class="card pers-card" data-pers="${p.nom}">
    <div class="pers-head"><div class="pers-avatar">${esc(p.affiche[0])}</div><div><h3>${nom}</h3><p>${connu ? 'Reconnu·e par le robot' : 'Rien d\'enregistré'}</p></div>${connu ? `<button class="pers-btn danger" data-pers-oublier="${p.nom}">Oublier</button>` : ''}</div>
    <dl class="pers-facts">
      <dt>Visage${src()}</dt><dd>${persBadge(v, nbV, 'non enregistré')}${v ? `<small>le ${esc(persDate(v.le))}</small>` : ''}</dd>
      <dt>Accord (visage)${src()}</dt><dd>${accord(av, v, 'visage')}</dd>
      <dt>Voix${src()}</dt><dd>${persBadge(x, nbX, 'non enregistrée')}${x ? `<small>le ${esc(persDate(x.le))}</small>` : ''}</dd>
      <dt>Accord (voix)${src()}</dt><dd>${accord(ax, x, 'voix')}</dd>
      <dt>Souvenirs${src('ha')}</dt><dd>${ha(p.ha.souvenirs, '/todo')}</dd>
      <dt>Dernier accueil${src('ha')}</dt><dd>${ha(p.ha.accueil, '/config/helpers')}</dd>
    </dl>
    <div class="pers-btns">
      <button class="pers-btn" data-pers-apprendre="${p.nom}">${v ? 'Visage : une séance de plus' : 'Apprendre le visage'}</button>
      <button class="pers-btn" data-pers-apprendre="${p.nom}">${x ? 'Voix : une séance de plus' : 'Apprendre la voix'}</button>
    </div></div>`;
}
function persFiches(){
  const manque = !P.dossiers.visage ? 'Aucun dossier de visages dans les réglages du corps : on ne peut pas enregistrer de visage.' : !P.camera ? 'Aucune caméra dans les réglages du corps : on ne peut pas enregistrer de visage.' : '';
  return (P.personnes.length ? `<div class="pers-grid">${P.personnes.map(persFiche).join('')}</div>` : '<div class="card"><div class="card-body"><p class="empty" style="margin:0">Personne n\'est encore enregistré·e.</p></div></div>')
    + `<div class="pers-more"><button class="pers-btn primary" data-pers-apprendre="">Ajouter une personne</button><span class="note" style="margin:0">${esc(manque)}</span></div>
    <div class="note">Seules des empreintes (des nombres) sont gardées, jamais de photo ni d'enregistrement. Elles ne servent jamais à autoriser une action. Visage et voix s'apprennent dans la rubrique <b>Apprentissage</b>.</div>`;
}
function personnesVue(){
  setTimeout(persCharger, 0);
  return `<div id="pers-root"><p class="empty">Chargement…</p></div>`;
}

/* ---------- la fenêtre ---------- */
function persDialogue(html){
  let d = document.getElementById('pers-dlg');
  if (!d){ d = document.createElement('dialog'); d.id = 'pers-dlg'; d.className = 'pers-dlg'; d.setAttribute('aria-label', 'Personnes'); document.body.appendChild(d);
    d.addEventListener('close', () => { clearInterval(persTimer); persCharger(); }); }
  d.innerHTML = `<div class="in">${html}</div>`;
  if (!d.open) d.showModal();
  return d;
}
const persFermer = () => document.getElementById('pers-dlg')?.close();
const persNom = n => n.charAt(0).toUpperCase() + n.slice(1);

function persOublier(nom){
  const aff = persNom(nom), p = P.personnes.find(x => x.nom === nom);
  const liste = [p.visage && 'l\'empreinte de son visage', p.voix && 'l\'empreinte de sa voix', (p.accord.visage || p.accord.voix) && 'l\'accord noté'].filter(Boolean);
  const d = persDialogue(`<h3>Oublier ${esc(aff)} ?</h3><p>Le robot ne reconnaîtra plus ${esc(aff)}. Ce qui sera effacé, <b>pour de bon</b> (aucune copie) :</p>
    <ul>${liste.map(x => `<li>${x}${src()}</li>`).join('')}</ul>
    <p>Ce qui reste dans Home Assistant (la liste « Mémoire de ${esc(aff)} » et la date de son dernier accueil${src('ha')}) ne s'efface pas d'ici.</p>
    <label class="fld">Pour confirmer, retaper le prénom<input type="text" id="pers-conf" autocomplete="off" placeholder="${esc(nom)}"></label>
    <div class="box bad" id="pers-err" hidden></div>
    <div class="acts"><button class="pers-btn" data-pers-annuler>Annuler</button><button class="pers-btn danger" id="pers-del" disabled>Oublier ${esc(aff)}</button></div>`);
  const champ = d.querySelector('#pers-conf'), bouton = d.querySelector('#pers-del');
  champ.oninput = () => { bouton.disabled = champ.value.trim().toLowerCase() !== nom; };
  bouton.onclick = async () => {
    bouton.disabled = true;
    try { await persPost('oublier', {nom, confirme: nom}); persFermer(); toast(`${aff} oublié·e — effacé pour de bon`); }
    catch (err){ const e = d.querySelector('#pers-err'); e.hidden = false; e.textContent = err.message; bouton.disabled = false; }
  };
}
function persAccord(nom, genre){
  const aff = persNom(nom);
  const d = persDialogue(`<h3>Noter l'accord de ${esc(aff)}</h3><p>L'empreinte de ${genre === 'voix' ? 'sa voix' : 'son visage'} existe déjà, mais aucun accord n'avait été noté. Il sera daté d'aujourd'hui et marqué « noté après coup ».</p>
    <label class="chk"><input type="checkbox" id="pers-ok"><span>${esc(aff)} est d'accord pour que le robot garde cette empreinte.</span></label>
    <label class="fld">Accord donné par<input type="text" id="pers-par" maxlength="60" value="${esc(aff)}"></label>
    <div class="box bad" id="pers-err" hidden></div>
    <div class="acts"><button class="pers-btn" data-pers-annuler>Annuler</button><button class="pers-btn primary" id="pers-go" disabled>Noter l'accord</button></div>`);
  const ok = d.querySelector('#pers-ok'), go = d.querySelector('#pers-go');
  ok.onchange = () => { go.disabled = !ok.checked; };
  go.onclick = async () => {
    go.disabled = true;
    try { await persPost('accord', {nom, genre, par: d.querySelector('#pers-par').value}); persFermer(); toast('Accord noté'); }
    catch (err){ const e = d.querySelector('#pers-err'); e.hidden = false; e.textContent = err.message; go.disabled = false; }
  };
}
document.addEventListener('click', e => {
  const b = e.target.closest('button,a'); if (!b) return;
  if (b.dataset.nav === 'personnes') persCharger();
  else if ('persApprendre' in b.dataset){ apprNom = b.dataset.persApprendre || null; history.replaceState(null, '', '#apprendre'); show('apprendre'); window.scrollTo({top:0}); apprCharger(); }
  else if (b.dataset.persOublier) persOublier(b.dataset.persOublier);
  else if (b.dataset.persAccord) persAccord(b.dataset.persAccord, b.dataset.genre);
  else if ('persAnnuler' in b.dataset) persFermer();
});
</script>

<!-- PARLER : début (11/10/2026) : le volume de sa voix, ses quatre étages, un essai. Préfixe parl-. Logique : reachy_son.py. -->
<style>
.parl-chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2);align-items:stretch}
.parl-stage{background:var(--surface-2);border-radius:var(--r-sm);padding:var(--s3)}
.parl-stage b{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.parl-stage .parl-big{font-size:22px;font-weight:680;font-variant-numeric:tabular-nums;margin-top:2px}
.parl-stage small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.parl-stage.parl-res{background:var(--accent-soft)}

.parl-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer}
.parl-btn:disabled{opacity:.55;cursor:default}
select.choix{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;min-width:180px;color:var(--text)}
select.choix:disabled{opacity:.55}
.line [data-parl-ecouter],.line [data-parl-voir]{margin-left:var(--s2)}

@media (max-width:860px){.parl-chain{grid-template-columns:repeat(2,minmax(0,1fr))} .parl-btn{min-height:var(--tap)} select.choix{min-width:0;flex:1 1 180px}}
</style>
<script>
'use strict';
let PARL = null, parlBusy = false;
const parlPct = v => (v === null || v === undefined) ? '—' : Math.round(v * 100) + ' %';
function parlerVue(){
  setTimeout(eveiLit, 0);
  return `<div id="parl-root"><p class="empty">Lecture du son…</p></div><div id="evei-root"></div>` + settings('parler');
}
function parlCorps(){
  const v = PARL;
  if (!v) return '<p class="empty">Lecture du son…</p>';
  if (!v.disponible) return card('Sa voix', '<p class="empty" style="margin:0">Le volume ne se règle pas sur cette machine.</p>');
  const hp = v.haut_parleur || {}, bas = hp.niveau !== null && hp.niveau !== undefined && hp.niveau < 100;
  const soir = v.manuel ? 'changé à la main ce soir' : ({normal:'pas maintenant', doux:'pièce calme', chuchote:'pièce très calme'})[v.cran] || v.cran;
  const etat = bas ? '<span class="badge warn">haut-parleur bas</span>' : (v.cran !== 'normal' ? '<span class="badge info">voix du soir</span>' : '<span class="badge ok">son normal</span>');
  const remis = hp.remis ? `remis à 100 % à ${esc(hp.remis)} (retombé à ${hp.retombe} %)` : (hp.garde ? 'gardé à 100 %' : 'garde coupée');
  const enreg = v.enregistre !== null && v.enregistre !== undefined && v.enregistre < 0 ? ` · ${v.enregistre} dB au rebranchement` : '';
  return card('En ce moment', `<div class="parl-chain">
      <div class="parl-stage"><b>Volume de sa voix</b><div class="parl-big">${parlPct(v.normal)}</div><small>ton réglage</small></div>
      <div class="parl-stage"><b>Voix du soir</b><div class="parl-big">× ${String(v.facteur).replace('.', ',')}</div><small>${esc(soir)}</small></div>
      <div class="parl-stage"><b>Haut-parleur${hp.garde ? ' <span class="badge ok">gardé</span>' : ''}</b><div class="parl-big">${hp.niveau ?? '—'} %</div><small>${remis}${enreg}</small></div>
      <div class="parl-stage parl-res"><b>Il parle à</b><div class="parl-big">${parlPct(v.applique)}</div><small>volume réellement appliqué</small></div>
    </div><p class="note">Le soir, dans une pièce calme, « Voix du soir » baisse le résultat. Si le haut-parleur retombe (quand le robot est rebranché), le robot le remet à 100 % dans la minute et l'écrit dans son journal.</p>`, etat)
  + `<div class="card"><div class="card-title"><span>Sa voix${src()}</span></div><div class="rows">
      <div class="row"><div><div class="row-label">Volume de sa voix</div><div class="row-help">Le volume du jour. La voix du soir part de là. Un changement fait ailleurs (Home Assistant, clavier) devient aussi le nouveau volume et s'affiche ici.</div></div>
        <div class="row-ctl"><div class="line"><input type="range" id="parl-vol" min="${Math.round(v.min*100)}" max="${Math.round(v.max*100)}" step="5" value="${Math.round(v.normal*100)}" style="--p:${(v.normal-v.min)/(v.max-v.min)*100}%" ${R.ecriture ? '' : 'disabled'} aria-label="Volume de sa voix"><span class="val" id="parl-val">${parlPct(v.normal)}</span></div>
        ${v.normal < 1 && R.ecriture ? '<button class="reset" data-parl-max>Revenir à 100 %</button>' : ''}</div></div>
      <div class="row"><div><div class="row-label">Essayer</div><div class="row-help">Il dit une courte phrase au volume ci-dessus. Pas le soir, ni pendant une conversation, ni s'il dort.</div></div>
        <div class="row-ctl"><div class="line"><button class="parl-btn" data-parl-essai ${R.ecriture ? '' : 'disabled'}>${ico('parler',16)}Essayer le son</button></div></div></div>
    </div></div>`;
}
async function parlLit(){
  if (parlBusy || document.hidden) return;
  parlBusy = true;
  try { const r = await fetch('/api/son', {cache:'no-store'}); if (r.ok) PARL = await r.json(); } catch (_) { /* le corps ne répond pas : on garde la dernière lecture */ }
  parlBusy = false;
  const racine = document.getElementById('parl-root');
  if (racine && !(document.activeElement && document.activeElement.id === 'parl-vol')) racine.innerHTML = parlCorps();
}
async function parlPost(chemin, corps){
  const r = await fetch('/api/son/' + chemin, {method:'POST', cache:'no-store',
    headers:{'Content-Type':'application/json', 'X-Reachy-Jeton': JETON}, body: JSON.stringify(corps || {})});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(perimee(r, data) || data.erreur || ('erreur ' + r.status));
  return data;
}
async function parlVolume(normal){
  try { PARL = await parlPost('volume', {normal}); toast('Volume de sa voix : ' + parlPct(PARL.normal)); }
  catch (err){ toast(err.message); }
  const racine = document.getElementById('parl-root'); if (racine) racine.innerHTML = parlCorps();
}
document.addEventListener('input', e => {
  if (e.target.id !== 'parl-vol') return;
  const t = e.target; t.style.setProperty('--p', ((t.value - t.min) / (t.max - t.min) * 100) + '%');
  document.getElementById('parl-val').textContent = t.value + ' %';
});
document.addEventListener('change', e => { if (e.target.id === 'parl-vol') { e.target.blur(); parlVolume(Number(e.target.value) / 100); } });
document.addEventListener('click', async e => {
  const b = e.target.closest('button,a'); if (!b) return;
  if (b.dataset.nav === 'parler') return parlLit();
  if ('parlMax' in b.dataset) return parlVolume(1);
  if (b.dataset.parlEcouter){
    b.disabled = true;
    try { await parlPost('ecouter', {son: b.dataset.parlEcouter}); toast('Écoute sur le robot…'); } catch (err){ toast(err.message); }
    setTimeout(() => { b.disabled = false; }, 3000);
    return;
  }
  if (b.dataset.parlVoir){
    const choix = document.querySelector(`select.choix[data-id="${b.dataset.parlVoir}"]`);
    if (!choix || choix.value === 'aucune') return toast('Aucune mimique choisie : il hoche la tête');
    b.disabled = true;
    try { await parlPost('mimique', {mimique: choix.value}); toast('Regarde le robot…'); } catch (err){ toast(err.message); }
    setTimeout(() => { b.disabled = false; }, 3000);
    return;
  }
  if ('parlEssai' in b.dataset){
    b.disabled = true;
    try { await parlPost('essai', {}); toast('Il parle…'); } catch (err){ toast(err.message); }
    setTimeout(() => { b.disabled = false; }, 3000);
  }
});
setInterval(() => { if (typeof current !== 'undefined' && current === 'parler') parlLit(); }, 5000);
window.addEventListener('hashchange', () => { if (location.hash === '#parler') parlLit(); });

/* 16/10 : carte « Mots d'éveil » (logique : reachy_eveil.py). « salut Alison » reste toujours actif ; en plus,
   un modèle microWakeWord de LVA (Okay Nabu…), réglé dans Home Assistant. Préfixe evei-. */
let EVEI = null, eveiBusy = false;
const eveiPct = v => Math.round(v * 100) + ' %';
function eveiCorps(){
  const v = EVEI;
  if (!v) return '';
  if (!v.ha.disponible) return card('Mots d\'éveil', `<p class="empty" style="margin:0">${esc(v.ha.erreur || 'Home Assistant ne répond pas')}</p>`, '', 'ha');
  const dis = R.ecriture ? '' : 'disabled';
  const opts = [['', 'Aucun (« salut Alison » seul)']].concat(v.modeles.filter(m => m.dispo).map(m => [m.nom, m.nom + (m.francais ? ' (entraîné aussi en français)' : '')]));
  const m = v.modeles.find(x => x.nom === v.mot);
  const etat = v.mot ? `<span class="badge ok">+ ${esc(v.mot)}</span>` : '<span class="badge">« salut Alison » seul</span>';
  const seuil = m ? `<div class="row"><div><div class="row-label">Exigence</div><div class="row-help">Plus haut : moins de faux réveils (télé, conversation), mais il faut le dire plus nettement. Valeur d'origine du modèle : ${eveiPct(m.defaut)}.</div></div>
      <div class="row-ctl"><div class="line"><input type="range" id="evei-seuil" min="${Math.round(v.min*100)}" max="${Math.round(v.max*100)}" step="1" value="${Math.round(v.seuil*100)}" style="--p:${(v.seuil-v.min)/(v.max-v.min)*100}%" ${dis} aria-label="Exigence du mot d'éveil"><span class="val" id="evei-val">${eveiPct(v.seuil)}</span></div>
      ${Math.abs(v.seuil - m.defaut) > 0.004 && R.ecriture ? '<button class="reset" data-evei-defaut>Valeur d\'origine</button>' : ''}</div></div>` : '';
  return `<div class="card"><div class="card-title"><span>Mots d'éveil${src('ha')}</span>${etat}</div><div class="rows">
      <div class="row"><div><div class="row-label">« Salut Alison »</div><div class="row-help">Toujours actif (reconnaissance en français sur le robot).</div></div><div class="row-ctl"><span class="badge ok">actif</span></div></div>
      <div class="row"><div><div class="row-label">Deuxième mot d'éveil</div><div class="row-help">Un mot du robot en plus, pour essayer. Les modèles anglais comprennent moins bien un accent français.</div></div>
        <div class="row-ctl"><div class="line"><select class="choix" id="evei-mot" ${dis} aria-label="Deuxième mot d'éveil">${opts.map(([k, t]) => `<option value="${esc(k)}" ${k === (v.mot || '') ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div></div></div>
      ${seuil}
    </div></div>`;
}
function eveiDessiner(){ const el = document.getElementById('evei-root'); if (el) el.innerHTML = eveiCorps(); }
async function eveiLit(){
  if (eveiBusy || document.hidden) return;
  eveiBusy = true;
  try { const r = await fetch('/api/eveil', {cache:'no-store'}); if (r.ok) EVEI = await r.json(); } catch (_) {}
  eveiBusy = false;
  const actif = document.activeElement;
  if (!(actif && (actif.id === 'evei-seuil' || actif.id === 'evei-mot'))) eveiDessiner();
}
async function eveiPost(chemin, corps, message){
  try {
    const r = await fetch('/api/eveil/' + chemin, {method:'POST', cache:'no-store',
      headers:{'Content-Type':'application/json', 'X-Reachy-Jeton': JETON}, body: JSON.stringify(corps || {})});
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(perimee(r, data) || data.erreur || ('erreur ' + r.status));
    EVEI = data; toast(message(data));
  } catch (err){ toast(err.message); }
  eveiDessiner();
}
document.addEventListener('input', e => {
  if (e.target.id !== 'evei-seuil') return;
  const t = e.target; t.style.setProperty('--p', ((t.value - t.min) / (t.max - t.min) * 100) + '%');
  document.getElementById('evei-val').textContent = t.value + ' %';
});
document.addEventListener('change', e => {

<script>
'use strict';
/* GET /api/apprendre (fiches, séances, capacités) ; /api/apprendre/tache (la séance en cours) ; /api/apprendre/vue
   (la dernière image analysée : cadres, conseils, ressemblances). Écritures : même jeton que les réglages. */
let A = null, apprNom = null, apprTimer = null, apprVueTimer = null, apprConfirme = null;
const apprAff = n => n ? n.charAt(0).toUpperCase() + n.slice(1) : '';
const apprNb = v => String(v).replace('.', ',');
const apprDate = iso => { try { return new Date(iso).toLocaleDateString('fr-FR', {day:'numeric', month:'long'}); } catch (_) { return ''; } };
async function apprPost(chemin, corps){
  const r = await fetch('/api/apprendre/' + chemin, {method:'POST', cache:'no-store',
    headers:{'Content-Type':'application/json', 'X-Reachy-Jeton': JETON}, body: JSON.stringify(corps || {})});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(perimee(r, data) || data.erreur || ('erreur ' + r.status));
  return data;
}
async function apprCharger(){
  const racine = document.getElementById('appr-root');
  if (!racine) return;
  try { const r = await fetch('/api/apprendre', {cache:'no-store'}); if (!r.ok) throw new Error(); A = await r.json(); }
  catch (_) { racine.innerHTML = '<p class="empty">Le robot ne répond pas. Réessayer dans un instant.</p>'; return; }
  const t = A.tache;
  if (t && t.etat === 'en cours' && t.nom) apprNom = t.nom;
  if (!apprNom || !A.personnes.some(p => p.nom === apprNom)) apprNom = apprNom && /^[a-z][a-z0-9-]{0,29}$/.test(apprNom) ? apprNom : (A.personnes[0] || {}).nom || null;
  apprDessiner();
  apprSuivre();
}
function apprPersonne(){ return A.personnes.find(p => p.nom === apprNom) || {nom: apprNom, affiche: apprAff(apprNom), visage: [], voix: [], accord: {}}; }
function apprSeances(liste, genre, unite){
  if (!liste.length) return `<ul class="appr-seances"><li><span>Aucune séance pour l'instant.</span></li></ul>`;
  return `<ul class="appr-seances">${liste.map(s => {
    const cle = genre + ':' + s.id, conf = apprConfirme === cle;
    return `<li><b>${esc(s.moment ? apprAff(s.moment) : 'Première séance')}</b><span>${esc(apprDate(s.le))}${s.nombre ? ' · ' + s.nombre + ' ' + unite : ''}</span>
      <button class="pers-btn ${conf ? 'danger' : ''}" data-appr-oublier="${esc(cle)}" ${A.capacites.ecriture ? '' : 'disabled'}>${conf ? 'Confirmer l\'oubli' : 'Oublier'}</button></li>`; }).join('')}</ul>`;
}
const accordRequis = () => !R || !R.valeurs || R.valeurs.accord_requis !== false;   // 11/10 : réglage de Personnes
function apprAccord(p, genre){
  const a = p.accord[genre];
  if (!a && !accordRequis()) return '';
  if (a) return `<div class="note">Accord de ${esc(p.affiche)} noté le ${esc(apprDate(a.le))}, donné par ${esc(a.par)}.</div>`;
  return `<div class="appr-accord"><label><input type="checkbox" data-appr-ok="${genre}"><span>${esc(p.affiche)} est d'accord pour que le robot garde une empreinte de ${genre === 'voix' ? 'sa voix' : 'son visage'} (des nombres, ni photo ni enregistrement).</span></label>
    <label style="flex-direction:column;gap:4px">Accord donné par<input type="text" data-appr-par="${genre}" maxlength="60" value="${esc(p.affiche)}"></label></div>`;
}
function apprDessiner(){
  const racine = document.getElementById('appr-root');
  if (!racine || !A) return;
  const t = A.tache, actif = t && t.etat === 'en cours';
  const chips = A.personnes.map(p => `<button class="appr-chip" data-appr-qui="${p.nom}" aria-pressed="${p.nom === apprNom}" ${actif ? 'disabled' : ''}>${esc(p.affiche)}</button>`).join('');
  const qui = `<div class="card"><div class="card-title"><span>Qui apprend ?${src()}</span></div><div class="card-body">
    <div class="appr-qui">${chips}<span class="appr-new"><input type="text" id="appr-prenom" maxlength="30" placeholder="Nouveau prénom" autocomplete="off" ${actif ? 'disabled' : ''}><button class="pers-btn" data-appr-ajouter ${actif ? 'disabled' : ''}>Ajouter</button></span></div>
    <div class="note">Une séance de plus = le robot reconnaît mieux dans une autre lumière ou une autre position. Il garde la meilleure ressemblance de toutes les séances.</div></div></div>`;
  if (!apprNom){ racine.innerHTML = qui + `<div class="card"><div class="card-body"><p class="empty" style="margin:0">Choisir ou ajouter une personne.</p></div></div>`; return; }
  const p = apprPersonne();
  racine.innerHTML = qui + `<div class="appr-grid">${apprVisage(p, t)}${apprVoix(p, t)}</div>
    <div class="note">Tout reste dans le robot : aucune photo, aucun enregistrement n'est gardé ni envoyé, seulement des empreintes (des nombres). Elles servent à saluer, jamais à autoriser une action.</div>`;
}
function apprVisage(p, t){
  const cap = A.capacites.camera, enCours = t && t.genre === 'visage' && t.nom === p.nom;
  let bas;
  if (enCours && t.etat === 'en cours'){
    const verif = t.phase === 'verification';
    bas = `<div class="appr-run" aria-live="polite"><div class="kick">${verif ? 'Vérification' : `Pose ${t.pose + 1} sur ${t.poses}`}</div>
      <div class="appr-big" id="appr-consigne">${verif ? 'Restez face au robot, il essaie de vous reconnaître…' : esc(t.consigne)}</div>
      <div class="pers-bar"><b style="width:${Math.round(t.fait / t.total * 100)}%"></b></div>
      <div class="note">${t.phase === 'consigne' ? `Prêt·e ? Images dans ${Math.ceil(t.compte || 0)} s` : `Image ${t.fait} sur ${t.total}`} · ${t.retenues} vue(s) nette(s) · il en faut ${A.vues_min}</div>
      <div class="appr-btns"><button class="pers-btn" data-appr-annuler>Annuler</button></div></div>`;
  } else {
    let fin = '';
    if (enCours && t.etat === 'fini'){ const v = t.verification || {}, bon = v.reconnu === p.nom;
      fin = `<div class="appr-msg ${bon ? 'ok' : 'warn'}">${bon ? `Séance apprise et ${esc(p.affiche)} reconnu·e (ressemblance ${apprNb((v.ressemblance || 0).toFixed(2))}).` : `Séance apprise, mais pas encore reconnu·e à l'instant (ressemblance ${apprNb((v.ressemblance || 0).toFixed(2))}). Une séance de plus, mieux éclairée, aidera.`}</div>`; }
    else if (enCours && (t.etat === 'erreur' || t.etat === 'annule')) fin = `<div class="appr-msg ${t.etat === 'erreur' ? 'bad' : 'warn'}">${esc(t.message)}</div>`;
    bas = fin + apprSeances(p.visage, 'visage', 'vues') + (cap ? apprAccord(p, 'visage') : '') +
      `<div class="appr-btns"><button class="pers-btn primary" data-appr-lancer="visage" ${cap && A.capacites.ecriture && !(t && t.etat === 'en cours') ? '' : 'disabled'}>Apprendre une séance · 30 s</button></div>` +
      (cap ? '' : `<div class="note">${esc(A.manque.camera)}</div>`);
  }
  return `<div class="card"><div class="card-title"><span>Visage${src()}</span><span class="badge ${p.visage.length ? 'ok' : ''}">${p.visage.length} séance(s)</span></div><div class="card-body">
    <div class="appr-cam"><img id="appr-img" alt="Ce que voit le robot" hidden><svg id="appr-over" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"></svg><div class="appr-vide" id="appr-vide">${cap ? 'Pas d\'image pour l\'instant' : 'Pas de caméra'}</div></div>
    <div class="appr-live" id="appr-live" aria-live="polite"></div>${bas}</div></div>`;
}
const APPR_ECOUTE = {bruit:'Silence quelques instants : le robot mesure le bruit de la pièce…', attente:'À vous : lisez la phrase, à voix normale.',
  parole:'J\'écoute…', analyse:'Analyse de la phrase…', entre:'Bien ! Phrase suivante…', fin:'Toutes les phrases sont lues.'};
function apprVoix(p, t){
  const cap = A.capacites.micro, enCours = t && t.genre === 'voix' && t.nom === p.nom, essai = t && t.genre === 'essai';
  let bas;
  if (enCours && t.etat === 'en cours'){
    const reussies = t.phrases.filter(Boolean).length, i = Math.min(t.phrase, t.total - 1), probleme = t.ecoute === 'refus' || t.ecoute === 'rien';
    const dots = t.phrases.map((x, k) => `<span class="${x ? (x.alerte ? 'warn' : 'ok') : k === t.phrase ? 'cur' : ''}" title="${x ? esc(x.alerte || ('ressemblance ' + (x.ressemblance != null ? apprNb(x.ressemblance) : '—'))) : ''}">${x ? '✓' : k + 1}</span>`).join('');
    const derniere = t.phrases[t.phrase - 1];
    bas = `<div class="appr-run" aria-live="polite"><div class="kick">${t.ecoute === 'fin' ? 'Terminé' : `Phrase ${i + 1} sur ${t.total}`} · le robot reste immobile</div>
      ${t.ecoute === 'fin' ? '' : `<div class="appr-phrase">${esc(A.phrases[i])}</div>`}
      <div class="appr-vu ${t.ecoute === 'parole' ? 'parle' : ''}"><b id="appr-vu" style="width:${Math.round((t.niveau || 0) * 100)}%"></b></div>
      <div id="appr-ecoute">${probleme ? `<div class="appr-msg warn">${esc(t.message)}</div>` : esc(APPR_ECOUTE[t.ecoute] || '')}</div>
      ${derniere && derniere.alerte && t.ecoute === 'entre' ? `<div class="appr-msg warn">${esc(derniere.alerte)} : vérifier qui lit.</div>` : ''}
      <div class="appr-dots">${dots}</div>
      <div class="appr-btns">${probleme ? `<button class="pers-btn primary" data-appr-phrase="refaire">Refaire</button><button class="pers-btn" data-appr-phrase="passer">Passer</button>` : ''}
        <button class="pers-btn ${t.ecoute === 'fin' ? 'primary' : ''}" data-appr-phrase="terminer" ${reussies >= A.phrases_min ? '' : 'disabled'} title="Au moins ${A.phrases_min} phrases réussies">Terminer et enregistrer (${reussies})</button>
        <button class="pers-btn" data-appr-annuler>Annuler</button></div></div>`;
  } else if (essai && t.etat === 'en cours'){
    bas = `<div class="appr-run" aria-live="polite"><div class="kick">Qui parle ?</div><div class="appr-big">Dites une phrase, n'importe laquelle (sans « Alison »).</div>
      <div class="appr-vu ${t.ecoute === 'parole' ? 'parle' : ''}"><b id="appr-vu" style="width:${Math.round((t.niveau || 0) * 100)}%"></b></div>
      <div id="appr-ecoute">${esc(APPR_ECOUTE[t.ecoute] || '')}</div><div class="appr-btns"><button class="pers-btn" data-appr-annuler>Annuler</button></div></div>`;
  } else {
    let fin = '';
    if (enCours && t.etat === 'fini') fin = `<div class="appr-msg ok">Séance apprise : ${t.retenues} phrases. Le robot l'utilise dès la prochaine phrase entendue.</div>`;
    else if (enCours && (t.etat === 'erreur' || t.etat === 'annule')) fin = `<div class="appr-msg ${t.etat === 'erreur' ? 'bad' : 'warn'}">${esc(t.message)}</div>`;
    else if (essai && t.etat === 'fini'){ const r = t.resultat || {}, sc = Object.entries(r.scores || {}).sort((a, b) => b[1] - a[1]);
      fin = `<div class="appr-msg ${r.nom !== 'inconnu' ? 'ok' : 'warn'}">${r.nom !== 'inconnu' ? `Reconnu·e : <b>${esc(apprAff(r.nom))}</b>` : 'Voix non reconnue'}<br><small>${sc.map(([n, s]) => `${esc(apprAff(n))} ${apprNb(s.toFixed(2))}`).join(' · ')} — il faut ${apprNb(r.seuil)} et ${apprNb(r.ecart)} d'avance</small></div>`; }
    else if (essai && t.etat === 'erreur') fin = `<div class="appr-msg warn">${esc(t.message)}</div>`;
    bas = fin + apprSeances(p.voix, 'voix', 'phrases') + (cap ? apprAccord(p, 'voix') : '') +
      `<div class="appr-btns"><button class="pers-btn primary" data-appr-lancer="voix" ${cap && A.capacites.ecriture && !(t && t.etat === 'en cours') ? '' : 'disabled'}>Apprendre une séance · ${A.phrases.length} phrases</button>
       <button class="pers-btn" data-appr-essai ${cap && !(t && t.etat === 'en cours') ? '' : 'disabled'}>Qui parle ?</button></div>` +
      (cap ? '<div class="note">Le robot s\'immobilise pendant la séance : ses moteurs ne se mêlent pas à la voix. Lire à sa place habituelle, à voix normale.</div>' : `<div class="note">${esc(A.manque.micro)}</div>`);
  }
  return `<div class="card"><div class="card-title"><span>Voix${src()}</span><span class="badge ${p.voix.length ? 'ok' : ''}">${p.voix.length} séance(s)</span></div><div class="card-body">${bas}</div></div>`;
}

/* ---------- le direct : la séance (0,3 s) et l'image analysée (1 s), seulement rubrique ouverte ---------- */
function apprVisible(){ return current === 'apprendre' && !document.hidden && document.getElementById('appr-root'); }
function apprSuivre(){
  clearTimeout(apprTimer);
  const tour = async () => {
    if (!apprVisible()) return;
    const avant = A && A.tache;
    if (avant && avant.etat === 'en cours'){
      try { const t = (await (await fetch('/api/apprendre/tache', {cache:'no-store'})).json()).tache; apprTache(avant, t); } catch (_) {}
    }
    apprTimer = setTimeout(tour, A && A.tache && A.tache.etat === 'en cours' ? 300 : 1500);
  };
  apprTimer = setTimeout(tour, 300);
  apprVue();
}
function apprTache(avant, t){
  A.tache = t;
  const memeEcran = t && avant && t.etat === avant.etat && t.genre === avant.genre && t.phrase === avant.phrase && t.ecoute === avant.ecoute
    && t.pose === avant.pose && t.phase === avant.phase && t.fait === avant.fait && Math.ceil(t.compte || 0) === Math.ceil(avant.compte || 0);
  if (memeEcran){ const vu = document.getElementById('appr-vu'); if (vu) vu.style.width = Math.round((t.niveau || 0) * 100) + '%'; return; }
  if (!t || t.etat !== 'en cours') return apprCharger();        // fin : les séances ont changé
  apprDessiner();
}
function apprVue(){
  clearTimeout(apprVueTimer);
  const tour = async () => {
    if (!apprVisible()) return;
    const img = document.getElementById('appr-img');
    if (img && A && A.capacites.camera){
      try {
        const [r, v] = await Promise.all([fetch('/api/image?t=' + Date.now(), {cache:'no-store'}), fetch('/api/apprendre/vue', {cache:'no-store'})]);
        const vue = v.ok ? await v.json() : null;
        if (r.ok){ const url = URL.createObjectURL(await r.blob()); const old = img.src; img.src = url; img.hidden = false; if (old.startsWith('blob:')) URL.revokeObjectURL(old); }
        apprPeindre(vue);
      } catch (_) {}
    }
    apprVueTimer = setTimeout(tour, 1000);
  };
  tour();
}
function apprPeindre(vue){
  const over = document.getElementById('appr-over'), live = document.getElementById('appr-live'), vide = document.getElementById('appr-vide');
  if (!over || !live) return;
  if (vide) vide.textContent = vue && vue.image ? '' : 'Pas d\'image pour l\'instant';
  const vs = (vue && vue.visages) || [];
  over.innerHTML = vs.map(f => { const [x, y, w, h] = f.boite, bon = f.qui && f.qui !== 'inconnu';
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${bon ? '#4cc581' : f.conseil === 'bien' ? '#6f9bff' : '#e3a43b'}" stroke-width="2.5" vector-effect="non-scaling-stroke" rx=".005"/>`; }).join('');
  if (!vs.length){ live.innerHTML = `<span class="badge">Aucun visage vu</span><span class="note" style="margin:0">Se placer face au robot.</span>`; return; }
  const f = vs[0], moi = f.scores[apprNom], seuil = (R && R.valeurs && R.valeurs.who_min) || 0.45;
  const qui = f.qui && f.qui !== 'inconnu' ? `<span class="badge ok">${esc(apprAff(f.qui))} reconnu·e</span>` : f.qui === 'inconnu' ? '<span class="badge warn">Visage inconnu</span>' : '';
  live.innerHTML = `${qui}<span class="badge ${f.conseil === 'bien' ? 'ok' : 'warn'}">${f.conseil === 'bien' ? 'Bonne image' : esc(f.conseil)}</span>` +
    (moi != null ? `<span>Ressemblance avec ${esc(apprAff(apprNom))} : <b>${apprNb(moi.toFixed(2))}</b> <span class="note" style="margin:0">(il faut ${apprNb(seuil)})</span></span>` : '') +
    `<span class="note" style="margin:0">visage ${f.taille} px · lumière ${Math.round(f.lumiere * 100)} %</span>`;
}

/* ---------- les gestes ---------- */
async function apprLancer(genre){
  const p = apprPersonne(), ok = document.querySelector(`[data-appr-ok="${genre}"]`), par = document.querySelector(`[data-appr-par="${genre}"]`);
  if (accordRequis() && !p.accord[genre] && !(ok && ok.checked)){ toast('Cocher d\'abord l\'accord de ' + p.affiche); return; }
  try {
    const r = await apprPost(genre, {nom: apprNom, par: par ? par.value : '', accord: p.accord[genre] || !accordRequis() ? undefined : true});
    A.tache = r.tache; apprDessiner(); apprSuivre();
  } catch (err){ toast(err.message); }
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button,a'); if (!b) return;
  if (b.dataset.nav === 'apprendre') return apprCharger();
  if (b.dataset.apprQui){ apprNom = b.dataset.apprQui; apprConfirme = null; return apprDessiner(); }
  if ('apprAjouter' in b.dataset){
    const n = (document.getElementById('appr-prenom').value || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase().replace(/[\s_]+/g, '-');
    if (!/^[a-z][a-z0-9-]{0,29}$/.test(n) || n === 'inconnu') return toast('Un prénom en lettres, sans espace (30 au plus)');
    apprNom = n; if (!A.personnes.some(p => p.nom === n)) A.personnes.push({nom: n, affiche: apprAff(n), visage: [], voix: [], accord: {}});
    return apprDessiner();
  }
  if (b.dataset.apprLancer) return apprLancer(b.dataset.apprLancer);
  if ('apprEssai' in b.dataset){ try { A.tache = (await apprPost('voix/essai', {})).tache; apprDessiner(); apprSuivre(); } catch (err){ toast(err.message); } return; }
  if (b.dataset.apprPhrase){ try { const r = await apprPost('voix/phrase', {action: b.dataset.apprPhrase}); A.tache = r.tache; if (r.tache.etat !== 'en cours') apprCharger(); else { apprDessiner(); apprSuivre(); } } catch (err){ toast(err.message); } return; }
  if ('apprAnnuler' in b.dataset){ try { await apprPost('annuler', {}); toast('Annulé : rien n\'a été enregistré'); } catch (err){ toast(err.message); } return apprCharger(); }
  if (b.dataset.apprOublier){
    if (apprConfirme !== b.dataset.apprOublier){ apprConfirme = b.dataset.apprOublier; return apprDessiner(); }
    const [genre, id] = b.dataset.apprOublier.split(':'); apprConfirme = null;
    try { A = Object.assign(A, await apprPost('oublier-seance', {nom: apprNom, genre, id})); toast('Séance oubliée, pour de bon'); } catch (err){ toast(err.message); }
    return apprDessiner();
  }
});
function apprendreVue(){
  setTimeout(apprCharger, 0);
  return `<div id="appr-root"><p class="empty">Chargement…</p></div>`;
}
</script>
